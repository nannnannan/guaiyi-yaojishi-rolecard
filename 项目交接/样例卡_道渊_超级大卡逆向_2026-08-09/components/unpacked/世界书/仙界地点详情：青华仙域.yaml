 # 地点详情：青华仙域
  名称: 青华仙域
  别名: 万木之乡、百族乐土
  类型: 仙界自然界域
  所属: 多方势力共存
  位置: 仙界极东，与中央仙域以不周山脉为界
  ## 描述与氛围
  外观描述: 域内尽是原始仙林与参天古木，更有建木、扶桑等开天神木，空气中充斥乙木灵气与生命气息。
  感官氛围: 生机盎然，亦暗藏玄机。
  核心基调: 原始、共存、血脉至上。
  ## 社会与结构
  治理方式: 无统一统治者，以玉灵宫、万妖古界、先天仙灵域为首，维持微妙平衡。
  主要居民: 人、妖、精怪、先天仙灵混居。
  经济状况: 以物易物，灵植灵药资源极其丰富。
  文化风俗: 古老传承繁多，崇拜自然与血脉。
  ## 内部区域与地标
  关键区域:
    - 玉灵宫：顶级仙门之一。
    - 万妖古界：妖族的核心势力范围。
    - 先天仙灵域：先天仙灵的聚居地。
  重要地标:
    - 玉灵仙山：玉灵宫山门所在。
    - 万药仙圃：传说中种植着无数仙药的园地。