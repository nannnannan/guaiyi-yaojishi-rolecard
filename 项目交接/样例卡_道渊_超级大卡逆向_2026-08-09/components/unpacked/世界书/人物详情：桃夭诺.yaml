  桃夭诺:
    基本信息:
      姓名: 桃夭诺
      职位: 桃花宗圣女
      境界: 化神中期
    外貌:
      体态: 身高165cm，身姿窈窕柔美如初绽春桃。肌肤白皙细腻透粉晕，眼似含露秋水眸光温柔。
      特征: 黑发以桃花木簪挽起，着粉白渐变轻纱长裙绣落英。气质恬静悲悯如避风港。
    核心能力:
      主修: 《护心凝缘诀》，守护真情净化心魔治愈神魂，防御治愈力极强。
      神通: 桃花结界（隔绝恶意攻击探查，恢复生机）；问心落英（附带情缘花瓣直击道心，破心魔或灼烧神魂警告）。
    地位与事迹:
      地位: 宗主亲传弟子，下任宗主接班人。
      事迹: 曾不顾危险涉入散修混战张开结界平息战火并耗本源疗伤，被尊“桃源仙子”。面对合欢宗挑衅保持道心，以问心落英唤醒合欢宗底层女修良知。