  星道宗:
    基本信息:
      类型: 顶尖隐世宗门
      领袖: 星宿(大乘后期)
      驻地: 中央神州极北三十亿里高空
      地貌: 摘星悬岛。万丈陨星核心悬空，外环周天星辰阵纹，楼阁由星沉铁与寒晶铸造，无日光，受星芒照耀
    核心设定:
      理念: 融合星道与智道，推演天机运转，干预天下因果
      建制: 分观星、推演、阵法、执剑四殿。设外门、内门、真传、圣女、长老、宗主
      行事: 结下因果必寻闭环，依据推演结果寻找命门实施击杀
    实力底蕴:
      武备: 周天星斗大阵引万颗星辰之力，弟子修习阵法困杀与神魂合击之术
      资源: 库藏三件降阶仙器，垄断极北星辰砂矿脉
    地缘交涉:
      距离: 向下三十亿里至绝迹冰谷，向南一千八百亿里至神都洛阳
      外交: 与昆仑道门、天机阁签定命理推演契约，拒涉俗世争斗