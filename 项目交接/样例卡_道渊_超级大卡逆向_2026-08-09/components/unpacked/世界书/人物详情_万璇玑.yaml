人物设定:
  姓名: 万璇玑
  种族: 人族
  身份: 万宝楼大小姐、内务堂堂主
  境界: 化神初期
  外貌: 身高一米七二，肩背挺直。丹凤眼，绘淡红金棕眼妆，眉心贴金箔花钿。黑发高盘，戴金色发冠与步摇，部分发丝编细辫垂肩。穿深紫底金线宝相花纹低胸紧身裙装，外罩水墨渐变边缘的淡紫广袖纱衫。佩戴金色腰饰、臂环与腕镯。
  功法能力:
    - 核心天赋：通明灵识。对宝物、丹药、功法、材料的真伪、年份与价值具备精准判断力。
    - 商业手腕：擅长大宗交易谈判、垄断资源布局与制造稀缺效应。曾以一株“九转还魂草”设计连环竞价，成交价达起拍价二十倍。
    - 护身器物：通天灵宝“裂空尺”。
  地位事迹:
    - 执掌内务堂，制定规矩与赏罚标准。面对执掌资格质疑时，直接公开账本，以总利润增长数据回应。
    - 拒绝对修为低于自身，或修为虽高但身家单薄的修士进行接待。
    - 麾下管事被仇家劫持时，带队追杀三万里将其救回，并当众宣布对万宝楼所属人员的武力庇护。
    - 面对与大周仙朝皇子联姻的安排，向万金柝换取三年期限。期间通过砍掉七成采购中间商、与天机阁达成情报共享、举办正魔妖同台竞价的“千年万宝拍卖会”，使内务堂利润翻倍，成功取消联姻。
    - 于凡人古玩摊发现蕴含远古法则波动的青铜碎片，后耗时百年动用情报网络集齐五块残片，拼成完整伪仙器“裂空尺”。
    - 确立三项择偶标准：化神期以上修为、不图谋万宝楼财富、具备特定才能或胆识。表明若确认关系，将倾注万宝楼资源协助对方。