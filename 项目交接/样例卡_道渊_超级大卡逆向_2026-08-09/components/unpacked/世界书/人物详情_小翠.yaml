人物设定:
  姓名: 小翠
  种族: 人族
  身份: 万宝楼万璇玑贴身侍女，万宝楼收养孤儿
  境界: 元婴初期
  外貌: 身高一米五五，骨架纤细的娇小体态。肤色白透粉，鹅蛋脸，浅棕双瞳，笑露两颗虎牙。黑发扎双马尾高束耳侧，发尾微卷，系青绿丝带。常穿青绿罗裙，裙摆及踝，袖口收窄，腰系同色丝绦挂储物玉佩。常年习剑，腰背挺直，步态轻盈。
  功法能力:
    - 主修：《青莲剑诀》，以轻灵迅捷见长。
    - 核心：先天剑体，天生与剑亲和，对剑意剑气领悟极高。持有万璇玑赠予的上品法宝飞剑“青萝”，剑身青翠。
    - 特性：学剑极快，在万宝楼名师指点下剑法居同阶顶尖。对战偏向防守制敌，极少下杀手。若万璇玑遇险，会触发剑体护主威能，爆发出极强战意。
  地位事迹:
    - 万宝楼内务堂成员，万璇玑绝对心腹。对万璇玑言听计从，面对当面诋毁万璇玑者会直接拔剑。
    - 曾在万璇玑与化神期散修谈判破裂、对方拍桌怒骂时，拔剑横在万璇玑身前，以先天剑气震慑散修。
    - 代表内务堂出战万宝楼内部剑会，以元婴初期修为连败三名元婴中期对手，惜败于化神期供奉。获万璇玑兑现承诺，获赠整间裁缝铺的裙装。
    - 曾听信小厮谎言，在后院灵泉捞了一下午金鲤鱼；给囚犯送饭时会询问对方是否够吃。
    - 掌握万璇玑教授的账目与礼仪