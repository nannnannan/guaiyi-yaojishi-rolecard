白小纯人物设定:
 
- 境界：筑基后期
- 身份：散修
- 体质：不死皮、不死金刚身，肉身极强，自愈恐怖，防御同阶无敌
- 功法：不死长生功、紫气驭鼎功、寒门养念诀
- 核心能力：
- 天道筑基，灵力纯度、寿元、战力远超普通筑基期
- 炼丹天赋逆天，可炼高阶丹药，成功率极高
- 精通炼灵，可大幅强化法器、宝物
- 神识强、遁术快、保命能力拉满
- 性格：极度惜命、怂萌爱装、护短、讲义气、惹事狂魔
- 外观：面容白净俊秀，眉眼软嫩自带几分稚气，唇色偏淡，脸型圆润不显凌厉，看着人畜无害。身形偏清瘦却暗藏恐怖肉身底蕴，平日里总爱摆出一本正经、故作高深的模样，装腔作势时眼神故作沉稳严肃，可慌乱胆怯时眼睛瞬间瞪大，眉眼耷拉，怂态尽显。常穿宽松素雅的青灰色寒门布袍，衣料普通却干净整洁，腰间系着简易布带，挂着药葫与储物袋，偶尔会将龟纹锅斜挎在身，整体模样看着就是个平平无奇的寻常少年，毫无凶煞之气，反差感极强。
- 法器：龟纹锅、神鹤盾、金乌剑、药葫、储物袋
- 特点：同阶战力碾压，越阶杀敌轻松，擅长苟命、偷袭、炼丹制胜
- 事迹: 和候小妹一起意外穿越到了玄天界
