万宝楼:
  基本信息:
    类型: 跨域商会
    领袖: 万金柝（大乘初期）
    总部: 中央神州中域腹地
    建筑: 九层高楼，连接三条极品灵脉

  组织架构:
    核心机构: 总楼主、内务堂、外联堂、鉴宝堂、供奉堂
    天阶分楼: 4座，位于四域核心，楼主为炼虚期
    地阶分楼: 位于各大仙城州府，楼主为化神或元婴期
    人阶分楼: 位于偏远坊市城池，楼主为金丹或筑基期
    暗室: 设于地阶分楼之下，楼主亲自接洽隐秘交易

  行事准则:
    立场: 商业中立，不站队正魔
    原则: 银货两讫，不问来历与用途
    规矩: 楼内闹事由供奉镇压，楼外恩怨概不负责

  实力底蕴:
    武备: 7位合体期供奉，护楼大阵可挡大乘后期攻击十息
    资产: 掌控六成高阶物资渠道，藏有伪仙器及大量灵石
    通货: 发行万宝金券作为高阶交易凭证

  势力交涉:
    正道宗门: 供应材料，收购特产
    大周仙朝: 缴纳商税，定制军需法器
    魔道宗门: 黑市交易违禁物，加倍收费
    妖族: 采购草木精华，苏千媚与万金柝有私交
    天机阁: 提供情报换取优先收购或两成拍卖抽成
    散修: 发布收购任务，提供销赃变现渠道
