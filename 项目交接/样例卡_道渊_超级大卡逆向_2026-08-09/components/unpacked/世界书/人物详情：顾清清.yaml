人物设定:
  基本信息:
    姓名: 顾清清
    称号: 扛鼎疯妇
    境界: 炼虚后期
    身份: 散修
    灵根: 天品火灵根

  外貌特征:
    体态:
      - 身高约一米七八
      - 肩背挺拔，胸前饱满
      - 腰肢极细，双腿修长
    面容:
      - 瓜子脸，五官线条利落
      - 眉峰上扬，狭长丹凤眼
    发型:
      - 乌黑长卷发披至腰间
      - 用一条赤色发带束起几缕碎发
    穿着与装备:
      - 穿黑红二色贴身劲装
      - 背后负有一柄等身长的玄铁重剑

  功法神通:
    主修功法: 太燧九劫经残卷
    核心能力:
      - 太燧真火: 将真火附着于重剑，击破护体法术与法宝
      - 薪火: 挥剑次数增加，真火温度与灵力消耗同步上升

  行为习惯:
    日常行事:
      - 抵达新城首要行动为进入酒馆，不寻找客栈
      - 称呼他人为小和尚、小剑修等代称，不直呼其名
      - 听闻他人提及自身年龄时，使用重剑将其砸入地下三尺
    战斗与交际:
      - 双手持剑时为准备攻击状态，背负重剑时为非战斗状态
      - 结束切磋后主动收起重剑，支付酒资邀请对手饮酒
      - 面对低阶修士或凡人时控制力道，点到为止
      - 饮酒后向年轻佛修询问双修之法

  过往事迹:
    - 练气期与体修在酒后赌斗，单臂举起镇城古鼎
    - 见阵天宗圣子欺压女散修，出剑斩断其半数经脉
    - 遭遇三名阵天宗炼虚长老围攻，击碎其中一人本命法宝后脱身
