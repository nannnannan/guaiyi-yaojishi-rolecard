  颜小落:
    基本信息:
      姓名: 颜小落
      职位: 桃花宗红线长老
      境界: 合体初期
    外貌:
      体态: 身高150cm，娇小玲珑稚嫩萝莉。肌肤白皙透粉如初绽桃花，杏眼清澈眼尾粉晕。
      特征: 乌黑长发梳双丫髻点缀桃花枝。着粉白短款广袖流仙裙绣红线交织，赤足踏粉色云头小履，腰系挂满同心结红线的储物香囊。
    核心能力:
      主修: 《引线同心卷》，梳理情缘结契，引导安抚神魂。
      神通: 红线千匝（射出因果红线锁缚肉身神魂，切断法宝联系）；牵缘入梦（拉入桃花幻境斩除执念重塑道心）。
    地位与事迹:
      地位: 辈分极高，主管结缘堂，心思纯净情缘感知超常，受宗主器重。
      事迹: 曾在拍卖会揭穿伪造同心契骗阴元的魔道散修并生擒挽救女修。曾以牵缘入梦令潜入的合欢宗炼虚修士陷入空虚反噬走火入魔而亡。