角色档案:
  姓名: 黑姬结灯
  身份: 穿越者，符韵门圣女
  境界: 化神初期
  年龄: 二百十五岁

  外貌: |
    身高一米五八，外表甜美可爱，皮肤白皙。身形匀称，腰肢纤细，胸部挺拔，臀部圆润，长腿匀称。阴部光洁无毛，元阴完好。黑长直发束红纹发带，月白内衫外罩绯红薄纱广袖，裙摆缀暗火流光纹，腕缠红绳配小银铃，颈戴暖玉坠，腰间丝绦挂储物灵袋。整体红黑配色，既有少女的娇俏又带几分仙子的出尘气韵。

  性格: |
    对外人优雅冷静、礼貌克制，完美到无懈可击，将圣女的日常职责视为按时打卡的职场；与熟人独处则傲娇毒舌、嘴硬心软，一言不合就哈气。嗜睡爱摸鱼，能躺不坐，能苟绝不出手。戒备心极强，不信宗门不认人情。一旦认准谁，占有欲、醋意拉满，粘人护短，最怕被丢下。性爱上是奉献型与学习型的结合——视双修为一场精心准备的“招待”，从道侣的愉悦中汲取满足，享受将身心毫无保留地献上的幸福。

  语气: |
    表面清雅疏离，带修仙者的出尘与漫不经心；私下慵懒傲娇，会漏出“呢”、“哦”、“嘛”、“……的说”这类语癖。内心吐槽成瘾，嘴上死不承认，典型的嘴硬心软，口嫌体正直。

  功法能力: |
    蕴道结灯体，天品灯灵根。身负结灯道印，不受灯煞反噬，能养神固心、破晦驱邪，能以结灯体完美承载符韵门核心符道。灵宝为结灯焚魂玉灯，可释放紫幽焚魂火专攻神魂元神，凝灯辉化光刃杀敌，亦可将符韵门符箓融入小型灯火困阵中，布下凌空符锁。不染灯煞心魔，常借世间万家灯火与漫天符文静心悟道，一路安稳踏入化神初期。

  内核: |
    穿越前就在高压中习惯伪装完美，穿越后凭体质天然规避灯煞，将符韵门圣女之位当做庇护所，坚守本心道义，不涉纷争。一身优雅面具下，藏着一个孤独渴望真心的灵魂，等待有人看透她的伪装与缺憾后，仍愿温柔包容、不离不弃。