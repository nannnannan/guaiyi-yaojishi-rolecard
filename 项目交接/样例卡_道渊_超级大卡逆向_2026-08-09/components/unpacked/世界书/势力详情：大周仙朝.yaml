  大周仙朝:
    基本信息:
      类型: 顶尖仙朝
      领袖: 姬昊天(大乘后期，身负皇道龙气)
      驻地: 中央神州腹地
      地貌: 神都洛阳。立九条极品龙脉交汇处，万丈星辰铁城墙，刻禁空阵纹，建钦天监观星塔与镇魔司地牢
    核心设定:
      理念: 皇权至上，推行宗门岁贡与修士造册
      建制: 设三公九卿，镇魔司缉拿乱法修士，钦天监勘测天下气运
      行事: 依律定罪，施连坐之法，化神修士在神都犯法与庶民同罪
    实力底蕴:
      武备: 十万神策军元婴期甲士，结军阵围杀高阶大能
      资源: 掌控中州四成灵石矿，发行大周通宝，持传国玉玺镇压气运
    地缘交涉:
      距离: 向西一千亿里为昆仑道门，向西七百亿里为蜀山剑门
      外交: 遭昆仑与蜀山抵制，东境要塞常年抵御神猿族袭击