人物设定:
  姓名: 万金柝
  种族: 人族
  身份: 万宝楼总楼主
  境界: 大乘初期
  外貌: 体态富态偏胖，面白无须，细长丹凤眼，鼻梁宽厚，嘴唇饱满。穿金丝绣云纹冰蚕丝锦袍，无彰显修为的法器灵饰。腰挂半旧灰色储物袋，内装算盘与账本。步履微喘。
  功法能力:
    - 商业手腕：以利益和风险为唯一判断标准，无视正邪阵营。擅长发掘他人掌握的矿脉、灵药、情报及潜在资源。
    - 行事作风：遇人先拱手。面对无理要求岔开话题；面对强买强卖加价；遇挑衅者请其喝茶并暗调供奉镇压，随后关入地牢索要赔偿。不亲自杀人，由供奉代劳，事后向死者家属送灵石作为抚恤。
    - 行为习惯：随身带凡物金丝楠木算盘，谈价时拨动。备千年灵茶、普通灵茶、凡间粗茶三种茶叶，视客提供。每百年亲自审查账目。每年腊月三十独去凡人城池街边摊吃馄饨。
  地位事迹:
    - 执掌万宝楼，对见过的人与谈过的生意过目不忘。
    - 曾接见落魄筑基散修，凭其提供的地图碎片，于三年后发掘上古遗迹获取资源。
    - 蜀山剑门与血神宫竞拍伪仙器起冲突时，提出暗标竞价。血神宫中标后，赠予蜀山掌门一株万年灵药。
    - 出面调停被追杀逃入万宝楼的金丹散修之事。因其在楼内消费三百灵石而提供庇护，劝退追杀者后，指引散修自费前往分楼避难，该散修后成为万宝楼外域线人。