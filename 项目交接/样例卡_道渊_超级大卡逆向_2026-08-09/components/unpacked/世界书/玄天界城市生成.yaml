城镇与坊市动态生成规则:
  生成要素:
    规模与灵脉:
      - 超级城池: 建于极品灵脉之上，长宽过亿里，常驻修士过千亿，大乘期坐镇，属于顶尖势力或顶尖宗门地界
      - 大型城池: 建于上品灵脉之上，长宽过千万里，常驻修士过百亿，合体期坐镇，属于大型势力或大型宗门地界
      - 中型坊市: 建于中品灵脉之上，长宽过百万里，常驻修士过亿，炼虚/化神期坐镇，属于中型势力或中型宗门地界
      - 小型坊市: 建于下品灵脉之上，长宽过十万里，常驻修士过千万，元婴期坐镇，属于小型势力或小型宗门地界
      - 黑市野坊: 无固定灵脉，游移不定或设于绝地边缘，无序交易

    势力归属:
      - 宗门直辖: 由单一顶尖/大型宗门完全控制，执行该宗门律法
      - 仙朝疆域: 隶属大周仙朝，设城主府与镇魔司分部，按律纳税
      - 联盟共管: 由多个商会或中小型宗门联合控制，如万宝楼牵头
      - 三不管地带: 位于两域交界或绝地边缘，由当地最强者制定临时规则

    功能特征:
      - 资源集散地: 靠近特定资源产地如矿脉或妖兽森林，以原材交易为主
      - 丹器符阵中心: 依托特定宗门如湮丹宗，以成品法宝丹药交易为主
      - 中转枢纽: 建于跨域传送阵节点，客流量大，情报流通快
      - 避难所: 设禁武大阵，缴纳高额灵石可获庇护

    建筑与地貌:
      - 地面城池: 筑高墙，刻护城法阵
      - 悬空城: 核心阵法托举，漂浮半空
      - 地下黑市: 挖空山腹或潜入地底
      - 水上坊市: 建于巨湖或灵舟舰队之上

  运转机制:
    准入与查验:
      - 入城费用: 按仙城等级收取下品至上品灵石
      - 身份令牌: 录入修士气息与灵力特征，作为通行凭证
      - 阵法筛查: 城门大阵自动识别魔气、妖气与通缉印记
      - 黑名单: 记录违规者气息，护城大阵自动排斥或绞杀

    核心设施分布:
      - 交易区: 设拍卖行、大型商铺与散修摆摊区
      - 功能区: 设任务悬赏大殿、跨域/跨州传送阵、生死擂台
      - 居住区: 划分天地玄黄四级洞府，依灵气浓度定价租赁
      - 核心区: 设城主府、镇魔司分部或宗门驻地，布设核心阵眼

    禁忌与法则:
      - 禁空法阵: 除持有特制令牌的执法队外，全城禁止御剑飞行
      - 禁武法则: 城内禁止私斗，违规者由大阵镇压并移交执法队
      - 宵禁制度: 夜间特定时段大阵转为封闭状态，停止进出
      - 交易税收: 官方商铺抽成，地摊按日缴纳摊位费

    突发事件响应:
      - 兽潮预警: 护城大阵转为防御杀阵，强制征召城内修士守城
      - 魔修潜入: 封闭城门与传送阵，执法队持搜魂法器封锁街区
      - 灵气潮汐: 开启聚灵阵，限制修士吸纳灵气速度以防阵法过载

  超级城池阶级分布与修为生态:
    人口结构:
      - 炼气/筑基/金丹期: 占据总修士数量九成，承担灵田种植、矿脉开采、基础炼材提取、阵法维护等底层劳作
      - 元婴期: 中坚力量，担任执法队成员、护卫或中小型商铺掌柜
      - 化神/炼虚/合体期: 高层管理，担任大型拍卖行管事、统领或大型商船护航者
      - 大乘期: 闭关修炼，作为势力武力底蕴，仅在涉及顶级资源分配或仙城存亡时出面

    超级城池区域隔离机制:
      - 外城区: 无修为限制，流通一至三阶资源，人员密集
      - 内城区: 需金丹期和元婴期境界及验资数百中品灵石方可进入，流通四至五阶资源
      - 核心区: 灵气最盛之地，仅对化神期以上修士或大势力核心弟子开放，流通六至七阶以上资源

    商铺运营层级:
      - 小型坊市: 主营一至三阶资源，筑基期为执事，金丹期为主事
      - 中型坊市: 主营四至五阶资源，金丹期为执事，元婴期为主事
      - 大型城池: 主营六阶资源，元婴期为执事，化神/炼虚期为主事
      - 超级城池: 主营七阶及以上顶尖资源，化神/炼虚期为执事，合体期为主事，接待顶级大能