  符韵门:
    基本信息:
      类型: 中央神州大型宗门
      领袖: 元容(合体中期)
      驻地: 中央神州北部云符山
      地貌: 山体由符文巨石堆砌，空中漂浮黄表纸与朱砂凝结的符文锁链，无实体山道
    核心设定:
      理念: 摄取天地法则封于寸纸
      建制: 以制符成功率定内外门阶层
      行事: 斗法同时抛掷百张符箓布设符阵
    实力底蕴:
      武备: 门人持千百张攻防符箓
      资源: 掌五雷正天符与大挪移符炼制法
    地缘交涉:
      距离: 距神都六百亿里，向北五百亿里至星道宗悬岛下方
      外交: 为神策军提供爆裂符，向万宝楼采购朱砂与妖血