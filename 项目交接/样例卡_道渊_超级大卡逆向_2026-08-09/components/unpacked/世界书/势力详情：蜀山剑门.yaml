  蜀山剑门:
    基本信息:
      类型: 中央神州顶尖宗门
      领袖: 白薇(大乘后期)
      驻地: 中央神州西部蜀山群峰
      地貌: 三千倒悬剑峰凭空漂浮，铁索相连，主峰立九层锁妖塔，刻满雷法金符
    核心设定:
      理念: 以心为剑，斩妖除魔
      建制: 分剑宗与气宗
      行事: 御剑入世，见魔修即拔剑
    实力底蕴:
      武备: 万剑归宗大阵，剑气杀伐
      资源: 掌剑冢秘境，凡人声望极高
    地缘交涉:
      距离: 向西三百亿里为昆仑，向东七百亿里为神都
      外交: 与昆仑、大雷音寺结盟制衡大周与魔修，入南离火洲斩杀血神宫与尸魔宗门人