  阵天宗:
    基本信息:
      类型: 中央神州大型宗门
      领袖: 乔梦玉(合体后期)
      驻地: 中央神州中部千阵岭
      地貌: 迷雾石林。笼罩白雾，石柱按八卦九宫排列，地脉灵气被抽取形成漩涡
    核心设定:
      理念: 刻阵纹于芥子，困杀万物
      建制: 分杀、幻、聚灵、传送、护灵五脉
      行事: 提前埋设阵旗布阵，引诱目标入阵
    实力底蕴:
      武备: 随身携带阵盘阵旗，激发微型阵法
      资源: 掌九天十地绝灭阵残图
    地缘交涉:
      距离: 距神都三百亿里，距万法宗九百亿里
      外交: 为各宗修缮护城大阵与传送阵，与万法宗研发阵法傀儡