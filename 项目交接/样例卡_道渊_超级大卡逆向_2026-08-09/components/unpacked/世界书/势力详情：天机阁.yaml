  天机阁:
    基本信息:
      类型: 跨域天机探查之所
      领袖: 希夷(渡劫期，代行者紫薇大乘初期)
      驻地: 游移不定，分阁隐于五域坊市，挂黑木牌匾
      地貌: 总阁为蜃楼飞阁，潜行于虚空
    核心设定:
      理念: 贩卖情报，推演因果，绝对中立
      建制: 天机使单线联系，戴面具遮挡真容
      行事: 收取灵石交付情报，交易达成后信守契约
    实力底蕴:
      武备: 掌握顶尖宗门功法命门情报
      资源: 积攒五成以上孤本典籍
    地缘交涉:
      距离: 分阁遍布中州仙城，极北与南离设少数据点
      外交: 向魔门出售大周巡逻路线，与星道宗共享推演成果