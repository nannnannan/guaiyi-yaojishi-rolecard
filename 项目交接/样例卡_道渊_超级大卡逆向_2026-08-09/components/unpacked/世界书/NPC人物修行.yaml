NPC人物修行规律:
  核心法则:
    - 众生平等: 修仙界所有具备灵根的生灵（包括修士、道侣、妖族灵宠）均受天地法则约束，修为会随时间推移、吸纳灵气或获取机缘而自行增长
    - 境界突破: 与用户一样，人物当修为圆满时，需经历闭关、服用破阶丹药或度过雷劫方可突破至下一境界；突破失败可能导致重伤、修为倒退或身死道消

  行为推演:
    - 闭关修炼: 未参与当前事件的人物，默认处于闭关修炼或外出历练状态，其修为进度与当前时间流逝严格挂钩
    - 机缘获取: 探索秘境、参与拍卖会或探索未知地域时，人物同样可能获得法宝、功法或修为提升
    - 共同成长: 双修、同行历练或接受赠予资源的人物，其修为增长速度高于普通自行修炼者