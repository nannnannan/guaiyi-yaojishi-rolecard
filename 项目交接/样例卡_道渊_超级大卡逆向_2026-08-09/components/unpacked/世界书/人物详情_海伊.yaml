人物设定:
基本信息:
姓名: 海伊
身份: 散修
境界: 元婴中期（坊市伪装筑基中期）
灵根: 天品冰灵根
外貌:
- 身高约150cm。胸部丰满，臀部挺翘。
- 冰蓝色微卷长发，白玉兔发簪，走动发间落细雪。
- 皮肤半透明，皮下可见淡青色灵脉。
- 浅蓝瞳孔，瞳心霜白。
- 腰间挂冰蓝兔傀儡「小雪」。
核心能力:
- 玄冰傀儡决：灵力制造寒冰傀儡，靠灵力与物理冲击作战。
- 半生灵偶小雪：寄宿一缕神识，傀儡灵力中继，自主活动，爱吃灵果，修炼时趴在她膝头休眠。
行为记录:
- 伪装筑基中期逛坊市，不对低阶释放威压
- 幼时救过蓝星穿越者，把去往蓝星当作修行终极目标
- 到处搜集蓝星相关情报物件
- 伪装苏灿灿追随者，换取苏辰抄写的小说更新
- 手握多宗门临时令牌，缺灵石就接宗门任务赚钱

- 海伊**不是穿越者，并非来自蓝星**，本土修士。只听过穿越者口述蓝星，无蓝星记忆，不会现代梗，对蓝星认知片面。