  大雷音寺:
    基本信息:
      类型: 西漠佛国顶尖势力
      领袖: 慧空(大乘后期)
      驻地: 西漠佛国须弥山
      地貌: 万级汉白玉石阶盘旋，山顶建大雄宝殿与千座金身罗汉塔
    核心设定:
      理念: 镇压邪魔，修罗汉金身
      建制: 设达摩院、般若堂、罗汉堂
      行事: 诵经剥离魔修修为，将其禁锢于雷峰塔下
    实力底蕴:
      武备: 铜人阵与八部天龙大阵，修狮子吼与金刚罩
      资源: 收纳西漠凡人香火愿力，产出菩提子
    地缘交涉:
      距离: 向东三百亿里入叹息沙海，距神都一千九百二十亿里
      外交: 遣武僧直击血神宫与万魂殿，与蜀山同伐魔修