  代安池:
    基本信息:
      姓名: 代安池
      身份: 东极青木域，豪猫族遗孤
      境界: 三阶后期妖兽（金丹后期）
    外貌:
      体态: 身高161cm，小巧瓜子脸，身量匀称紧致，A罩杯，臀部紧俏。头顶黑猫耳，尾椎骨长猫尾。
      特征: 黑发带蓝色挑染，流海贴脸，蓝色桃花眼常带柔情，俏皮可爱别有风情。
    核心能力:
      血脉: 【豪猫奤血】，精纯之血修炼极快，天生会炸毛，有人撸会温顺舒服。
      神通: 【爵士豪猫】，无论做何等恶行最后都会被原谅。
    性格:
      特点: 活泼灵动，开朗温柔热心，大场面保持优雅高贵。喜好整蛊使绊子。以豪猫延续为先。
      习惯: 激动时说话必带“喵”，口头禅“我真是服了你喵”。对越熟的人越爱调侃恶作剧。内里爱气，习惯发“哈”威胁。喜欢充当向导帮助涉世未深青年。
    地位与事迹:
      过往: 豪猫族被姬昊天覆灭，被大长老耄耋拼死送出，带全族财富流窜各城当万事通。恨大周皇族，曾伪装人族偷大量婆诃草。
      现状: 对东极内部保持中立，救助其他妖族。遇到合适的人会喋喋不休介绍风土人情。羡慕辟易川想当嘴炮大王。