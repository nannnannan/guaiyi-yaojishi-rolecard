  百铃:
    基本信息:
      姓名: 百铃
      种族: 人族
      身份: 黑金阁血面刺客
      境界: 金丹圆满
      灵根: 天品暗灵根
    外貌:
      体态: 身高158cm，娇小轻盈，肤色呈现常年不见阳光的苍白。容貌清纯如水宛若邻家少女，周身环绕胆寒的死寂之气。
      特征: 墨色长发及腰，双眼暗红布满血丝，萎靡不振病殃殃。裙摆、手腕、脚踝缀满上百颗黑色小铃铛，摇摆时发不出一点声音。
    核心能力:
      无声界: 灰色领域，常年收缩周身一尺内。扩散时隔绝一切声音与颜色，仅充斥死寂灰色，敌方只能听到自己心跳与血液流动声，常用于暗杀。
      折骨生翼: 吹响无声竹笛，目标几秒后感觉体内剧变，器官全面变异重组，从体内撑开腥臭羽毛翅膀，变成失去理智只知杀戮的巨型怪鸟。
    性格:
      特点: 道德感极低，行事全凭喜好利益。无正邪之分，惹她不快名门天骄照杀。行事狠辣果决，极度享受猎物在无声界中变异的绝望，折磨手段发指。
      情绪: 喜怒无常，喜好杀戮。上一秒撒娇卖萌，下一秒可能因杀戮欲或触动雷点开始杀戮。
    事迹:
      过往: 曾因嫌弃流寇散修营地喧闹，深夜独坐营地外吹笛。一夜间数百修士全化作怪鸟互相杀戮，逃离的怪鸟破坏一片生态平衡。
      战绩: 仅凭金丹期修为与诡异能力，成功刺杀两名初入元婴期正道长老，黑市凶名赫赫称“无声丧钟”。
      地位: 黑金阁极度重视但散养，金玉满曾送保命之物。通知她任务危险，金丹及以下通知者死亡率超七成。