  青玉宗:
    基本信息:
      类型: 中央神州大型宗门
      领袖: 玄璃(合体后期)
      驻地: 中央神州西南部青音湖
      地貌: 湖心岛。水面生青色玉莲，建竹楼水榭，风过伴金石之音
    核心设定:
      理念: 以音入道，音波化刃
      建制: 按琴、瑟、钟、笛分四阁，只收女修
      行事: 拨动乐器释放音波幻境斩杀目标
    实力底蕴:
      武备: 门人配特制法器乐器
      资源: 藏仙器残件伏羲琴弦
    地缘交涉:
      距离: 距蜀山五百亿里，距百花谷两百亿里
      外交: 遭合欢宗觊觎，向天机阁买乐谱，与蜀山女修交流