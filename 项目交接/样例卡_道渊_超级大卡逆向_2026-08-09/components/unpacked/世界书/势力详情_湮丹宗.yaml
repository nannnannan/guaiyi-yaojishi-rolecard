  湮丹宗:
    基本信息:
      类型: 中央神州大型宗门
      领袖: 林寒绾(合体后期)
      驻地: 中央神州南部杏临谷
      地貌: 谷内开辟十万亩灵田，引地心火脉建百座炼丹高塔，飘散药香与丹劫雷云
    核心设定:
      理念: 以天地灵物入药，丹道通神
      建制: 设草木堂、控火堂、成丹堂
      行事: 以丹药换取资源，发布丹药悬赏令雇佣修士杀敌
    实力底蕴:
      武备: 持本命丹炉，掷毒丹与爆裂丹杀敌
      资源: 掌三张上古九阶丹方，圈养万年火灵
    地缘交涉:
      距离: 距神都洛阳八百亿里，向南三百亿里为烬骨荒原边缘
      外交: 与万宝楼包销丹药，高价收购南离火洲火属妖丹，与合欢宗共控南梁古国种植紫灵米