  万魂殿:
    基本信息:
      类型: 顶尖魔道宗门
      领袖: 秦浅月(大乘后期)
      驻地: 南离火洲阴风山脉万鬼窟
      地貌: 山体中空，建黑曜石殿宇，悬挂引魂白灯笼
    核心设定:
      理念: 抽魂炼魄，炼化怨鬼壮大神识
      建制: 依驭鬼数量与魂幡品阶定座次
      行事: 潜伏暗杀，隐秘抽取修士生魂炼入魂幡
    实力底蕴:
      武备: 门人持顶阶万魂幡
      资源: 掌控阴冥河支流，产出养魂阴玉
    地缘交涉:
      距离: 距东侧血神宫三百亿里，向东北五百亿里为古战场
      外交: 与尸魔宗在十万大山古战场争夺尸骸