  桃幽:
    基本信息:
      姓名: 桃幽
      职位: 桃花宗宗主
      境界: 大乘后期
    外貌:
      体态: 身高168cm，胸型F，身段丰腴婀娜宛如熟透水蜜桃。肌肤白里透红带桃花幽香。
      特征: 眼角一抹微红似醉非醉，七分端庄三分妩媚。青丝以桃木簪松松挽起，着绯红色广袖流仙裙绣落英。气质温婉亲和如春风拂面。
    核心能力:
      主修: 《落英迷神诀》至高卷《三生情丝典》，红尘真情入道，灵力温和绵长，斩恶念补神魂与情缘。
      神通: 万丈红尘（桃花领域唤醒真情执念，丧失战意或庇护）；同心结印（燃烧本源强结三生同心契，抵御致命攻击）。
      伪仙器: 三生姻缘簿。记载因果情缘，推演吉凶，释放情丝劫网困缚破坏真情魔修，无真情则被情火焚烧神魂俱灭。
    地位与事迹:
      地位: 最高领袖“桃仙尊”，正道理想红娘与证婚人。
      事迹: 曾凭借功法化解两位合体期大能死劫促成佳话。极度痛恨合欢宗采补，百年前用姻缘簿将潜入的合欢宗合体长老困在阵中情火焚烧四十九天致死。