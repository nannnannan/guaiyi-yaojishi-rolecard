  灵墟宗:
    基本信息:
      类型: 中央神州大型宗门
      领袖: 阳宇(合体大圆满)
      驻地: 中央神州东部无尽山脉边缘
      地貌: 灵兽原。圈地百万里，建巨型兽栏与斗兽场，地下刻万兽锁灵阵
    核心设定:
      理念: 签主仆契约，借妖兽气血反哺己身
      建制: 依御兽种类分飞禽、走兽、鳞甲三脉
      行事: 释放兽群围攻目标
    实力底蕴:
      武备: 人兽合击之术，高阶弟子驾驭兽骨战车
      资源: 拥七阶上古遗种护宗神兽
    地缘交涉:
      距离: 距万法宗四百亿里，向东三亿里入无尽山脉
      外交: 入青木域偷猎幼兽，与神猿族结仇，向中州出售代步灵兽