黑金阁:
  基本信息:
    类型: 地下黑市
    领袖: 金玉满（黑金之主，天机阁推演三次皆遭反噬中断）
    总部: 无固定驻地

  组织架构:
    黑金议会: 最高层，共9席，死后由继承者补位
    执行层五面:
      - 金面: 负责销赃与地下交易
      - 血面: 负责暗杀与悬赏，掌控死士杀手
      - 影面: 负责情报刺探与宗门渗透
      - 鬼面: 负责走私与跨域运输网络
      - 盗面: 负责秘境探索与遗府掠夺

  行事准则:
    理念: 不问来历，只问价值
    方式: 无公开旗号，在各仙城设立隐秘据点，主动制造赃物

  实力底蕴:
    武备: 无固定山门与护宗大阵，由五面分散掌控武力
    资产: 占据地下交易七成份额，囤积赃物、禁器、人魂、妖血

  势力交涉:
    万宝楼: 互为最大销赃市场与赃物来源，共存竞争
    正道宗门: 公开敌视，暗中通过黑金渠道销赃
    魔道宗门: 与血神宫、尸魔宗、万魂殿长期交易
    妖族: 秘密交易妖丹与血脉结晶
    大周仙朝: 神策军明面围剿外围势力，暗地合作
    天机阁: 长期敌对，交锋持续数千年