  蛟龙一族:
    基本信息:
      类型: 北冥雪原顶尖妖族
      领袖: 敖凌霜(八阶大圆满妖帝，负上古冰夷血脉)
      驻地: 北冥雪原之下北冥黑渊
      地貌: 水晶龙宫。建于三万丈深海海沟，以万年寒母撑起结界，外围布绞杀阵法与漩涡
    核心设定:
      理念: 吞噬资源提纯真龙血脉
      建制: 妖帝君主制，以战斗与资源贡献获取地位
      行事: 碾压掠夺，屠戮一切闯入黑渊的生灵
    实力底蕴:
      武备: 覆海卫军团控水御冰，海域战力倍增
      资源: 独占玄冥重水及极寒天材地宝
    地缘交涉:
      距离: 正上方一千万里为广寒宫地界
      外交: 袭击广寒宫矿脉，强抢万宝楼商船，鄙视神猿族与九尾天狐族