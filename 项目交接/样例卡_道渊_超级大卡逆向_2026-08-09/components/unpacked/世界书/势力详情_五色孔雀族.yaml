  五色孔雀族:
    基本信息:
      类型: 顶尖妖族势力
      领袖: 孔灵月(八阶初期妖帝)
      驻地: 东极青木域南部落凤坡
      地貌: 五色谷。生五行灵树，弥漫青黄赤黑白五色瘴气，树冠筑琉璃鸟巢
    核心设定:
      理念: 提纯五行血脉，衍化五色神光法则
      建制: 依尾羽颜色划分五脉
      行事: 拒绝与外族通婚，击杀踏入领地者，夺取五行法宝
    实力底蕴:
      武备: 施展五色神光刷落五行法宝
      资源: 占五行伴生矿脉
    地缘交涉:
      距离: 距西北神猿族两千亿里，向北一千八百亿里为青丘
      外交: 封锁落凤坡两百亿里地界，与神猿族互不侵犯