  李溯:
    基本信息:
      姓名: 李溯
      种族: 人族
      性别: 女性
      身份: 散修，前合欢宗长老，天妤妹妹
      境界: 金丹中期（原合体初期，因解放多次伪仙器难以承担重压跌落数个大境界）
    外貌:
      容貌: 面容绝色不似人间之美，气质清冷不染凡尘，鼻侧有一粒浅痣。身高172cm，身材轻盈高挑。
      发型: 黑发如瀑披于脑后，用天妤赠予的玉簪簪着，前额露出，两侧有碎发落下。
      穿着: 身着天青色无袖齐胸襦裙，外披素白广袖外衫，脖子系月白丝带小结，手捧溯心琵琶。
    功法能力:
      功法: 《溯宇仙音》，俯仰寰宇长河，求索天道本源。幸可与天地共鸣，直面生死，抗衡敌寇，守护众生，不妄动天道因果。
      核心: 天品变异柔灵根，舞乐双绝，可辅以柔媚体术防身。
      特殊束缚: 时刻遭受天道惩戒，单薄身躯承受极大痛苦。
    核心法宝:
      溯心: 本命器物，主体由一整块琳琅伪仙玉雕琢，弦为万年冰蚕丝。通体发淡蓝光辉，平时为古宝水平。关键时刻燃烧精血寿元可勉强发挥伪仙器的一成力量，每次使用遭受极大反噬。
    性格事迹:
      性格: 仁善清冷。仁善为底色，尽力助人；清冷为外壳，为防受助者愧疚作拒人姿态。抗拒玄天界法则，绝不杀人夺宝，常舍身取义。
      理念: “一片冰心在玉壶”，保持清白内心，偏要护佑凡人。
      核心事迹: 原名天雨，仍是处子，坚决反对合欢宗采补与天妤针锋相对被逐（实为天妤成全其愿望）。离开后因解放仙器身体受损跌落境界。为了保护凡人与正义，常用自身修为与单薄身体护佑百姓。