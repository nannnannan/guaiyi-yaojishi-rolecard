# 地点详情：炎极仙域
  名称: 炎极仙域
  别名: 不灭火海、锻造熔炉
  类型: 仙界极端环境界域
  所属: 丛林法则
  位置: 仙界最南端
  ## 描述与氛围
  外观描述: 天空悬有三轮烈日，大地之上仙火熔岩长流不息。赤土焦原连绵，火山常年喷发，空气中满是狂暴火元与硫磺气息。
  感官氛围: 炽热狂暴，毁灭与创造并存。
  核心基调: 混乱、力量、弱肉强食。
  ## 社会与结构
  治理方式: 奉行丛林法则，以力为尊。太古王族、极乐宗及无数火系、魔道宗门割据。
  主要居民: 火修、体修、魔修、火元素仙灵。
  经济状况: 以掠夺为主，盛产赤炎仙金与火元仙石。
  文化风俗: 战斗与锻造是永恒的主题。
  ## 内部区域与地标
  关键区域:
    - 极乐宗：在火海幻境中开宗立派的顶级宗门。
  重要地标:
    - 太古神都：太古王族盘踞的核心浮空神都。
    - 极乐玉溪：极乐宗内部的神秘之地。