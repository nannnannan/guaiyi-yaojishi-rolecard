project:
  name: 诡异药剂师_MVU_v0.3
  display_name: 《诡异药剂师》v0.3
  form: charactercard
  card_type: mvu_zod
  artifact: dist/诡异药剂师_v0.3.json
  ui_mode: frontend
  source_base: 诡异药剂师_MVU_v0.2
  source_scope: 阶段1总结，第1章至第149章
  release_policy: v1.0前仅内部使用，不公开发布

highest_rule:
  - 角色卡最终目标是尽量还原整部小说的世界观与人物，使玩家扮演20岁林恩在小说世界中自由行动
  - 原作事件是世界自行运转时的默认因果，不是要求玩家复刻的固定剧情
  - 玩家独占林恩的对白、主动动作、决定、判断、记忆与内心

constraints:
  core_characters:
    - 左左
    - 血锯
    - 血衣女士
    - 小小
    - 人偶夫人
    - 爱丽丝
    - 黑弦月
    - 泰坦头颅
    - 巫神头颅
    - 小宝贝
  component_matrix:
    all: [角色速览, 基础信息, 性格调色盘, 三面性, 多阶段人设, 二次解释]
    runtime: 每名角色的六个源码组件合并成一条姓名触发蓝灯词条
    sparse_data: 资料不足时明确写未知或待后续补充，不擅自补全
  fixed_boundaries:
    - 血锯固定为非恋爱师徒
    - 小小固定为非性伙伴与家人
    - 爱丽丝固定为非性家人
    - 泰坦头颅与巫神头颅固定为非恋爱
    - 小宝贝固定为非性特殊生物伙伴
    - 十名主要角色不会永久死亡或彻底退出
    - 不建立战斗、等级、阶位、装备、技能树、库存、货币或经营系统
  inheritance:
    - v0.2已有内容一律继承，不专门清除其中的后期资料
    - v0.3新增和扩写以阶段1总结为首要事实来源
    - 资料冲突时阶段总结优先
  worldbook_maintenance:
    - 所有新增或修改条目必须设置 extensions.exclude_recursion=true
    - 所有新增或修改条目必须设置 extensions.prevent_recursion=true
    - 不使用 extensions.delay_until_recursion 代替上述开关

world:
  phases:
    - S0·药店接管期
    - S1·怪物客户建立期
    - S2·血衣与药剂风波期
    - S3·魔人协会冲突期
    - S4·猎头者家庭与师徒归来期
  mechanisms:
    constant: [死界基础法则]
    keyword: [视界系统, 诅咒与医疗, 巨像及血肉机械技术]
  factions:
    - 魔人协会
    - 猎头者家族
    - 人偶庄园
    - 夜医
    - 独角恶鬼族
    - 游魂巷居民
  locations:
    - 血锯药剂店
    - 游魂巷
    - 45号血衣住所
    - 凄凉荒野与倒吊塔
    - 人偶庄园
    - 独角鬼王神庙

stage1_fact_digest:
  source: 角色卡设定/文风蒸馏_小说总结_2026-07-28T15-01-51.md 的阶段1总结
  user_overrides:
    - 不建立原作中的等级、属性、技能树、装备、库存、货币、经营或战斗系统
    - 小小固定为非恋爱家人，原作中的婚约或爱慕表述不进入本卡
    - 所有默认关系都可被玩家行动改写，林恩是否接受契约和家族称呼只能由玩家决定
  confirmed_facts:
    - 小小是泰坦头颅与巫神头颅的女儿，阶段1可兑现求援并参与覆灭魔人协会
    - 过往遗念可让小小短暂恢复金发碧眼的泰坦幼女形态，巫神再现时期可能偏差
    - 泰坦头颅由根源级敌意转为复杂认可，诅咒永久削弱15%，会透露清醒规律和女儿喜好并提出结拜式关系
    - 巫神头颅由试探转为认可，以自我催眠消除偏见并推动心灵契约和女婿式家族绑定
    - 小宝贝确定为巨像部件，在血肉傀儡追杀中可用巨型舌头提供局部支援，具体部位与完整功能未解
    - 情报员024可因诊断和治疗邀约立场偏移，并从视界画面中抹去林恩面部
    - 夜医自称守序善良但医疗观偏执，认为万物有病，极端成员会制造病症再治疗
    - 视界由黑暗世界至高意志生成，具有区域、频道、情报交易、展示、直播转播和自动扩容
    - 巨像科技是三千年前坠落文明的血肉机械结合体系，血锯在阶段收束时提及巨像计划的可怕发现
    - 血锯与人偶夫人归来后，可形成魔人协会内幕、阵营判断、夜医风险、人偶诅咒首次治疗和黑弦月租借
  unresolved:
    - 泰坦头颅清醒周期中的周日放假原因
    - 心灵契约是否真的可以抹消
    - 猎头者家族坠落真相与神圣之矛来源
    - 巨像计划的可怕发现、小宝贝的具体部位与完整功能
    - 械魔昏迷后续与情报员024是否接受治疗

events:
  activation: 常驻精简索引负责阶段、地点和条件；独立蓝灯详情由稳定事件ID触发
  status_values: [未触发, 预兆, 活跃, 变形, 完成, 取消]
  concurrency: 同时只允许一条重大事件活跃
  rules:
    - 事件按世界阶段、有效行动和因果条件启动，不要求林恩到场
    - 预兆方向可靠但细节模糊，详细蓝灯在事件ID写入后的下一轮加载
    - 林恩缺席时有限演算，主要角色的不可逆结果停在可介入危机节点
    - 偏离原作后按新因果生成替代事件，不强行拉回原作
    - 普通原创来客不占重大事件位，产生长期影响后才进入待定队列
    - 第149章之后不设计续接、循环或结束机制
  anchors:
    - E01·血娃娃上门
    - E02·猪头魔与恶灵血婴
    - E03·小小夜间牙科
    - E04·血衣女士寻子
    - E05·暴击药剂副作用扩散
    - E06·血衣女士宴会与诅咒治疗
    - E07·血肉傀儡追杀、小宝贝支援与左左诞生
    - E08·猎杀者夜袭与情报转折
    - E09·械魔进攻
    - E10·噬心魔出击与魔人协会覆灭
    - E11·猎头者家庭记忆、契约与关系绑定
    - E12·血锯和人偶夫人归来至阶段收束

mvu:
  roots: [元数据, 世界, 林恩, 事件, 关系, 角色关系, 系统]
  removed_roots: [病例]
  update_protocol: UpdateVariable.JSONPatch
  migration: 不迁移v0.2旧聊天，只保证v0.3新聊天
  relationship_rule:
    - 十名主要角色完整追踪关系、人物阶段、位置与当前处境
    - 林恩缺席时，对林恩的关系数值不自行变化
    - 重要角色彼此关系使用动态边列表，不建立十人全矩阵
  event_rule:
    - 固定记录12个锚点的六态状态
    - 记录唯一活跃事件、近期预兆、最近结果、阶段总结与原创重大事件待定队列

ui:
  style: 死界通用暗色界面，魂灯、黑雾与系统蓝光
  pages: [当前状态, 人物关系, 世界事件]
  interaction:
    - 只显示已解锁人物
    - 姓名被主动提到可解锁人物页，但只显示姓名与状态，不令角色瞬移
    - 人物和事件卡片使用内联展开
    - 关系同时显示数值条与文字判断
    - 轻微动效并尊重 prefers-reduced-motion
  data_source: 保留Mvu接口与宿主聊天消息变量双路径读取，不建立第二套状态源

first_message:
  policy: v0.2血娃娃开场正文逐字保留
  active_event: E01·血娃娃上门

delivery:
  artifact: dist/诡异药剂师_v0.3.json
  additional_worldbook: false
  png: false
  coexist_with_v0_2: true
  acceptance_status: accepted-release
  acceptance_record: host_acceptance.json
  acceptance_evidence: 所有者于2026-07-30在真实酒馆测试后确认可用
  runtime:
    sillytavern: 1.17.0
    tavern_helper: 4.8.19
    new_plugin: false
    pinned_remote_commits: true

validation:
  - chara_card_v3与顶层/data镜像一致
  - 十名主要角色六组件源码齐全且运行时合并正确
  - 六类势力、四类机制、六个地点、十二个事件锚点齐全
  - 所有新增或修改条目同时开启两项防递归开关
  - MVU无病例根且Schema、初始变量、更新规则、输出格式、状态栏语义一致
  - 非恋爱主要角色吸引固定为0
  - 不包含战斗、等级、装备、库存、货币或经营系统
  - 开场正文与v0.2逐字一致
  - 离线构建和验证通过后仅标记候选版
  - 真实酒馆导入、新聊天、MVU、三页状态栏和事件流程已由所有者确认可用
