  component_matrix:
    all: [角色速览, 基础信息, 性格调色盘, 三面性, 多阶段人设, 二次解释]
    runtime: 每名角色六个源码组件合并为同一条人物蓝灯；事件详情窗口内的核心人物自动激活，姓名/别名仍可由酒馆原生关键词激活，两路命中同一UID时只注入一次；条目内EJS只呈现当前事件状态允许的人设阶段
    stage_split: 组件用事件状态和人物解锁状态分段，身份反转与幕后知识不得提前公开
    sparse_data: 资料不足时明确写未知或"不详"，不依据名称、同类角色或后续章节推断；严禁瞎编
    new_characters: 黑弦月、喵喵、林樱、艾雯爵士、羽毛笔、a01银色幻想、欲望母树为新增独立人设；倒吊天使在UID200上扩写阶段三内容（教母线/圣血/战争许可/暗面疑云），不更换稳定UID
    rephrase_gate: 候选二次解释延续v0.6约定；新增人设的深入二次解释如素材不足允许写"不详"占位
  fixed_boundaries:
    - 色色与恶堕等情节全面开放，所有女性角色（含爱丽丝、小小、左左）恋爱、吸引与恶堕均正常推进，不设幼态/年龄锁
    - 固定非恋爱的男性角色维持原样：血锯、白逸、泰坦头颅、小宝贝、白夜、渡鸦、黑颅、猪头屠夫、哭泣小丑、黑白小丑；艾雯爵士为义兄/师长向非恋爱
    - 白小凌为配角NPC：并入概念或群像，不建人设、不入关系根，不设色色设计也不设禁令
    - 玩家仍独占林恩的对白、主动行动、决定、判断、记忆与内心；NPC可主动暧昧与逆推，但林恩的行为仍由玩家驱动
    - 不建立战斗数值、等级成长、阶位、装备、技能树、库存、货币或经营系统；原文等级只作轻量记录；战斗机制与物品详写进概念供玩家自由发挥
    - 不维护天数或日历系统；24小时能力时限与15日压制只作为原作状态事实，不建立可运算日历计数器
    - 关键运行协议同时镜像到角色提示词和常驻世界书核心条目，不依赖可被预设省略的单一插槽
  continuity:
    - v0.6的E01至E35、17人六组件、93条概念、路由与MVU协议全部作为基线保持不变；本版只在新增范围内修改
    - E35→E36为新增桥：阶段三以左左拟化人形后的日常为起点（E36），E43教子线与E44炼药线衔接阶段二已建立的夜医身份
    - 血衣女士诅咒未治愈；默认线为林恩忘记回游魂巷和续治，玩家实际回访时由关系关键记忆覆盖默认线
    - 爱丽丝地缚诅咒续费在阶段三全程超期（紧急度最高钩子）；E34天使血对哭泣小丑的15日压制在阶段三期间自然到期，复发留作后续钩子
    - 黑弦月阶段二到店封装；E51开箱激活并签30日保护契约，E53撕毁雇佣契约改平等邀请——原"到店封装"概念条目删除，内容并入人设
    - 白夜E33转正、E35后与林恩同在黑夜城；E57随队出征、E59-E61包围圈线、E63后彻底失联——阶段三收尾钩子
    - 泰坦、巫神、小小E59投票驰援，全程在途，未抵达战场——不得写成已会合
    - 蓝星线：白逸、血娃娃留蓝星；克勒斯被擒转审；林恩断指与召唤仪式副本已送主教（反向追踪风险）
