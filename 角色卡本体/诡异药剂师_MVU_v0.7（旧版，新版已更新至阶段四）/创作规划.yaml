mvu:
  roots: [元数据, 世界, 林恩, 事件, 关系, 角色关系, 系统]
  removed_roots: [病例]
  update_protocol: UpdateVariable.JSONPatch
  migration: 不迁移旧聊天，只保证v0.7新聊天
  relationship_rule:
    - 二十四名核心人物复用同一17字段关系结构
    - 林恩缺席时，对林恩的关系数值不自行变化
    - 好感、信赖、戒备、吸引、关系创伤与恶堕互不合并，范围0至100；色色与恶堕全面开放，女性角色无锁
    - 重要角色彼此关系使用动态边列表，上限64，不建立全矩阵
  event_rule:
    - 固定记录64个锚点六态，阶段总结最多8条
    - 无活跃事件与无近期预兆使用标准空对象
    - 最近结果最多12条，每项含事件ID、标题、结果、世界影响四个字符串字段
  initial_state:
    - E01完成、E02活跃且收尾为true、E03至E64未触发
    - 新增七人关系对象均未解锁，恶堕初始0，按开放口径正常推进
    - initial_variables、开场initvar与状态栏FALLBACK_STATE必须深度一致

concepts:
  router_uid: 399
  existing_range: 400-492
  new_range: 493-550
  stage3_note: 阶段三概念详写、数量不设上限；v0.6的"黑弦月"物品概念条目删除（UID留空不重排），内容并入新人设；新增概念按类别顺序分配493-550（机制493-506、势力507-513、场景514-525、物品526-537、特殊设定538-540、人物541-550）
  new_character_uids: 黑弦月270、喵喵280、林樱290、艾雯爵士291、羽毛笔292、a01银色幻想293、欲望母树294（避开事件素材区间300-363）
  state_variants:
    mode: 事件锚点状态门控变体（event_state_gated_variants）
    gate_source: stat_data.事件.锚点状态.<事件ID>.状态
    gate_states: [完成, 变形]
    baseline_required: true
    variant_required_fields: [事件演进, 当前状态]
    variant_optional_fields: [人物关联, 来源, 定义]
    static_form_allowed: true
    ejs_restrictions: 只读锚点状态、无const/let、无await、无activewi、无getEnabledWorldInfoEntries、首行保持标题行不加装饰器
    ordering: 门控事件从新到旧、末块必为兜底；同一条目两路激活与关键词绿灯命中时都渲染同一份当前状态变体

