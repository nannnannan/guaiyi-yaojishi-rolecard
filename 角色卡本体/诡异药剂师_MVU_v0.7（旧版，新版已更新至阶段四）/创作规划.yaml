stage3_fact_digest:
  source: 角色卡设定中的阶段3大总结与小总结14至20
  chapter_range: 第277至431章
  confirmed_facts:
    - 白逸以林恩断指血肉为信标完成跨世界召唤，林恩降临蓝星魔都清剿血肉神教入侵
    - 克勒斯被林恩活捉；血娃娃被"暴食"仪式召至蓝星后由林恩带回黑暗世界
    - 林恩在平行蓝星锁定母亲位置并发现加密户籍的平行"林恩"；回归时被虚无锁链拖回，距母亲百米喊出"妈妈"
    - 被缚天使读取林恩记忆后收其为教子（教母关系确立）
    - 专属召唤法阵追溯出"无瞳之眼"血色法阵，为更大法阵的一部分，来源不明
    - 召唤祷文含"萝莉控"描述的版本成功率94%
    - 喵喵原为被疫医缝入犬皮改造的猫，315号疫医博士封存档案揭示真相；千人夜医接受其寻亲委托
    - 第七人偶黑弦月到货并激活30日保护契约；林恩识破人偶夫人三重算计后撕毁契约、平等邀请（情感开发度15→18）
    - 疫医森一·940四级元勋夜袭刺杀被反制，四次重生后死于max以M之拳
    - 艾雯爵士提出"疫医是夜医的暗面"推测，林恩获31支武装小队24小时最高级保护
    - 巨像之脑现世引发两教大战；欲望母树与血肉支配者结盟下场
    - 银色幻想a01斩断林恩右臂，以M之拳经信息同调传染机械集群；血肉利维坦降临，白夜护林恩昏迷后被治
    - 泰坦、巫神、小小投票3:2决定驰援，全程在途
    - 圣徒·379号博士叛变揭破；疫医包围圈中白夜意志被"前辈"创伤击穿，林恩自残清醒后以max以M全场唤醒
    - 突围战顺走圣徒本命武器夺萃之镰；圣徒以左臂萎缩为代价释放"死亡凋零"瘟疫
    - 林恩折跃入城压制凋零至20（故意留病根），升30级获赛博机械蓝图（阉割版）
    - 林恩以疫医伪装（白面具/黑斗篷/触手/黑镰/凋零特效）解围畸变堡垒：喵化诅咒把机械变哆啦A梦、摧毁心灵振荡器、人偶小姐改写导弹轨迹
    - 欲望教派误认林恩为疫医高阶干部/母神信徒，声望大刷
  unresolved:
    - 白夜及夜医主力的下落
    - 林樱的身份与触碰记忆闪现内容
    - 克勒斯审问结果与血肉神教对断指信标的反向追踪
    - 圣徒被猫娘药剂喵化后的后续
