mvu:
  roots: [元数据, 世界, 林恩, 事件, 关系, 角色关系, 系统]
  removed_roots: [病例]
  update_protocol: UpdateVariable.JSONPatch
  migration: 不迁移旧聊天，只保证v0.6新聊天
  relationship_rule:
    - 十七名核心人物复用同一17字段关系结构
    - 林恩缺席时，对林恩的关系数值不自行变化
    - 好感、信赖、戒备、吸引、关系创伤与恶堕互不合并，范围0至100
    - 重要角色彼此关系使用动态边列表，上限48，不建立全矩阵
  event_rule:
    - 固定记录35个锚点六态，阶段总结最多8条
    - 无活跃事件与无近期预兆使用标准空对象
    - 最近结果最多12条，每项含事件ID、标题、结果、世界影响四个字符串字段
  initial_state:
    - E01完成、E02活跃且收尾为true、E03至E35未触发
    - 新增九人关系对象均未解锁，按恋爱边界设置吸引与恶堕锁
    - initial_variables、开场initvar与状态栏FALLBACK_STATE必须深度一致

concepts:
  router_uid: 399
  existing_range: 400-451
  new_range: 452-492
  total: 93
  stage1_enrichment:
    scope: UID400至451共52条既有概念，只补充和整理原条目，不新增同义条目、不更换稳定UID、不改变既有类别与核心含义
    sources:
      - 角色卡设定/世界观+地点势力+时间线+事件/deepseek小说总结（小总结）.md中的阶段1大总结
      - 同一文件中的小总结01至07，覆盖第1至149章
    authority: 用户当前口径优先，其次为小总结对应章节事实，再次为阶段1大总结；后期全局总结只用于核对名称，不把后续信息倒灌成阶段一已知事实
    format:
      - 标题保留事件数组，并与extensions.tavernweave.event_ids逐项一致
      - 每条包含唯一事实门槛，以及定义、来源、事件内演进、机制、限制与代价、当前状态、人物关联、未知项和禁止外推
      - 普通条目目标450至850个中文字；复合能力、诅咒与跨阶段物品可在信息真实且不重复时适当增加
      - 事件编号只表示强制激活窗口，不自动兑现原作默认结果；预兆、活跃或取消态不得把完成结果写成当前事实
      - 玩家是否治疗、交易、战斗、使用能力、接受关系或收取物品始终以聊天事实为准
      - 保留原主关键词与事件关联；只有小总结和阶段1大总结共同证明现有注册错误时才允许修正，并同步worldbook、contract与验证器
      - 无跨事件状态变化的概念正文保持静态；状态随事件变化的概念采用状态变体EJS；两路激活不变：事件详情前后各1窗口强启或酒馆原生关键词绿灯，同一world.uid只注入一次并保持双递归保护
  state_variants:
    mode: 事件锚点状态门控变体（event_state_gated_variants）
    gate_source: stat_data.事件.锚点状态.<事件ID>.状态
