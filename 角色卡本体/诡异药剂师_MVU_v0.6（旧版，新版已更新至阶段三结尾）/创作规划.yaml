stage2_fact_digest:
  source: 角色卡设定中的阶段2大总结与小总结08至13
  chapter_range: 第150至276章
  confirmed_facts:
    - 幸福之家表层治疗真实发生，爱丽丝暂时隐去身形，卡梅尔与女主人短暂恢复
    - 玛丽深层诅咒在同一次出诊中复燃；卡梅尔与女主人后续按小总结09处理，最终意识与生死状态未知
    - 白逸来自九州蓝星魔都，林恩来自地球上海，两者为不同平行世界
    - 未完成的心与脑之汤由林恩饮用，机械改造知识和哭泣小丑诅咒均落在林恩身上
    - 爱丽丝重建后吞噬玛丽，默认线认林恩为家人并交付一半产权与传送锚点
    - 哭泣小丑显化体在寂静镇被剥离击杀，但诅咒仍可能复发
    - 夜医考核只实际完成工具、疼痛与心理部分，白夜以隐藏结局特批转正
    - 阶段末林恩是正式夜医、良医和平使者与主母直属学徒，不提前写成教子
  unresolved:
    - 卡梅尔与女主人被收作药引后的意识、生存和恢复状态
    - 左左拟化人形的持续时间、战力与完整功能
    - 随机诊断术在显化体剥离后是否完全恢复为纯诊断
    - 哭泣小丑15日压制结束后的复发方式
    - 白衣倒吊女鬼来源、目标和调查局袭击结果
    - 黑弦月正式开箱与启用时机属于阶段三

events:
  activation: UID1常驻调度按MVU状态注入当前锚点前后各1条完整详情；稳定事件ID条目UID300至334仅作为构建素材并保持禁用，不参与原生关键词扫描
  status_values: [未触发, 预兆, 活跃, 变形, 完成, 取消]
  concurrency: 同时只允许一条重大事件为活跃态；变形是稳定收束态
  time_progression: 纯事件驱动，不记录日历；开场仍为E01完成、E02收尾活跃
  rules:
    - 事件按世界状态、有效行动和局部因果条件启动，不要求林恩复制原作行动
    - 完成、变形、取消必须依事件自身收束条件判定，中途事实不能冒充完成
    - E21至E34含下一事件引入；E35只含阶段3待续钩子，不创建E36
    - 前件完成或变形时可按触发条件正常推进；前件取消时状态栏不自动猜测，必须由正文检查局部依赖并用单条replace /事件处理
    - 前件取消只影响真正失去必要因果的局部事件；存在替代入口或独立支线时允许后件进入预兆或变形
    - E28与E35均为双线事件；任一线稳定存在即可走变形收束，不堵塞后续或阶段收束
    - 事件身份、状态、收尾与预兆迁移必须以单条replace /事件提交完整事件对象
    - 玩家主权守卫适用于所有事件引子、默认走向和系统提示
