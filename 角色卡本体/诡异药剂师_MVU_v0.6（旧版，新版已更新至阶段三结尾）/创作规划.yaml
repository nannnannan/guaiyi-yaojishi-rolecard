project:
  name: 诡异药剂师_MVU_v0.6
  display_name: 《诡异药剂师》v0.6
  version: 0.6.0
  form: charactercard
  card_type: mvu_zod
  artifact: dist/诡异药剂师_v0.6.json
  ui_mode: frontend
  source_base: 诡异药剂师_MVU_v0.5
  source_scope: 在v0.5完整事件链、人设EJS、概念双路路由和MVU协议上扩写第150至276章阶段二，并按阶段二详写规格补全第1至149章既有概念
  release_policy: v1.0前仅内部使用；离线通过后保持candidate，真实宿主验收后才可标accepted-release

highest_rule:
  - 角色卡目标是还原整部小说的世界观与人物，使玩家扮演17岁林恩在小说世界中自由行动
  - 原作事件只提供世界自行运转时的默认因果，不要求玩家复刻固定剧情
  - 玩家独占林恩的对白、主动动作、决定、判断、记忆、态度、感情与内心
  - 不预设关系结局，不自动推进亲密，不替玩家拒绝或接受任何关系
  - 阶段二只覆盖第150至276章与小总结08至13，第277章后的内容只留钩子

constraints:
  core_characters:
    - 左左
    - 血锯
    - 血衣女士
    - 小小
    - 人偶夫人
    - 爱丽丝
    - 白逸
    - 泰坦头颅
    - 巫神头颅
    - 小宝贝
    - 倒吊天使
    - 白夜
    - 渡鸦
    - 黑颅
    - 猪头屠夫
    - 哭泣小丑
    - 黑白小丑
  component_matrix:
    all: [角色速览, 基础信息, 性格调色盘, 三面性, 多阶段人设, 二次解释]
    runtime: 每名角色六个源码组件合并为同一条人物蓝灯；事件详情窗口内的核心人物自动激活，姓名/别名仍可由酒馆原生关键词激活，两路命中同一UID时只注入一次；条目内EJS只呈现当前事件状态允许的人设阶段
    stage_split: 组件用事件状态和人物解锁状态分段，身份反转与幕后知识不得提前公开
    sparse_data: 资料不足时明确写未知，不依据名称、同类角色或后续章节推断
    rephrase_gate: 新增九人的深入二次解释先输出至候选二次解释目录逐条待确认；正式二次解释组件仅写用户已经确认的身份边界、知识隔离与关系边界
  fixed_boundaries:
    - 血锯固定为非恋爱师徒；离行是履行既定计划，不解释为抛弃
    - 小小固定为非恋爱家人，吸引与恶堕永久锁定0
    - 泰坦头颅、巫神头颅与小宝贝固定非恋爱
    - 白逸、白夜、渡鸦、黑颅、猪头屠夫、哭泣小丑、黑白小丑固定非恋爱，吸引与恶堕永久锁定0
    - 爱丽丝为存世数百年的地缚灵；非性恋爱与吸引方向开放，但现阶段幼态外观下恶堕锁定0；只有后续事件明确形成独立成年身体形态并再次确认才可解锁
    - 倒吊天使恋爱、吸引与亲密接受度开放；原作之吻、任务和高好感不代替玩家同意
    - 爱丽丝暂时隐去身形属于恶灵与怨灵能力，不等于消散、死亡或永久离场
    - 哭泣小丑是体内诅咒人格与显化体；黑白小丑是独立本体，两者不得合并
    - 猪头屠夫与黑白小丑是长线最终反派之一；幕后目的只供叙事层使用，林恩当前不知
    - 不建立战斗数值、等级成长、阶位、装备、技能树、库存、货币或经营系统；原文等级只作轻量记录
    - 不维护天数或日历系统；24小时能力时限与15日压制只作为原作状态事实，不建立可运算日历计数器
    - 复述玩家行动时只兑现玩家声明的动作与客观结果，不添加态度、性格、情绪、姿势、熟练度或内心判断
    - 玩家概括声明手术或治疗时采用结果化被动句，不擅自拆成未声明的操作步骤
    - 关键运行协议同时镜像到角色提示词和常驻世界书核心条目，不依赖可被预设省略的单一插槽
  continuity:
    - E20已经决定外出但尚未真正离店；E21完成临行训练与授权，E26返店复盘后才正式离行
    - E20已知幸福之家传闻；E21从正式订单开始，不重复首次介绍
    - 黑弦月租借交割且实体已到店，但保持封装、未正式启用；阶段二不出场、不调用阶段三能力
    - 幸福之家只发生一次连续出诊；卡梅尔与女主人先短暂恢复，再被玛丽深层诅咒复燃影响
    - 血衣女士诅咒未治愈；默认线为林恩忘记回游魂巷和续治，伏笔不得主动提醒林恩，玩家实际回访时由关系关键记忆覆盖默认线
    - E31只击杀当次哭泣小丑显化体；诅咒根因保留，E34天使血只压制15日，后续会再次爆发
  character_event_route:
    左左: [E11, E12, E18, E20, E22, E23, E24, E26, E33, E35]
