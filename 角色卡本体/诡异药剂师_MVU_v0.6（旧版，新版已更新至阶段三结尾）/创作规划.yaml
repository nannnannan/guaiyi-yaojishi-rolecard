inheritance:
  - v0.5源码、产物与accepted-release记录保持不变；v0.6只在独立目录内修改
  - v0.5的E01至E20、52条概念、8名角色六组件、状态栏和验证协议全部作为基线
  - 先同步本规划，再修改源码；dist只由构建生成

worldbook_maintenance:
  - 所有新增或修改条目显式设置extensions.exclude_recursion=true与extensions.prevent_recursion=true
  - 事件详情保持当前锚点前后各1事件；事件上下文摘要与衔接钩子保持当前锚点前后各3事件
  - UID1常驻调度是事件全文的唯一运行时注入源；UID300至334只作为构建素材保留并统一禁用，禁止因事件标题关键词形成第二份正文
  - 概念物品使用当前锚点前后各1事件强制激活或酒馆原生关键词绿灯激活，两路命中按同一UID只注入一次
  - 核心人物按当前锚点前后各1事件的出场映射自动激活，同时保留姓名/别名原生关键词绿灯；自动路由、关键词与人物EJS共同命中时仍只激活同一人物UID一次
  - 人物自动路由优先读取extensions.tavernweave.event_ids，并保留UID到事件数组的静态回退，避免宿主剥离自定义扩展后失效
  - 统一路由只处理包含UID399机制条目的本卡世界书；其他已启用世界书即使复用相同UID也不得被误激活
  - 概念正文分两种形态：无跨事件状态变化的概念保持静态；状态随事件变化的概念采用状态变体EJS，事件数组写在extensions.tavernweave.event_ids并在标题事件数组中保留回退信息
  - 概念状态变体按事件锚点状态路由：每个变体块从新到旧链式门控，只认完成或变形，末块必为兜底；变体门控事件允许超出标题事件数组
  - 概念变体EJS只读stat_data.事件.锚点状态.EXX.状态，禁用const/let/await/activewi/getEnabledWorldInfoEntries；首行仍是标题行，不加装饰器
  - 幸福之家传闻与完整真相分条；哭泣小丑机制与天使血压制分条，防止事件窗口过早泄底
  - 跨事件共用概念只扩展原UID，不复制同义条目
  - BX-01强效麻药、优惠券、名片、订单地图、视界石、成就和一次性卷轴保留在事件正文，不拆独立概念

