validation:
  - v0.5目录、产物和accepted-release哈希保持不变
  - 世界书共167条：既有102条、新增15事件、9人物和41概念
  - 35事件均有六态门控、双标题、固定字段顺序和明确收束条件；E21至E34有下一事件引入，E35无E36
  - E20至E35形成15对新增桥，完整事件链共34对桥
  - 新事件默认走向为200至500个中文字，完整文件目标1200至1800字
  - 十七名角色六组件源码齐全且运行时合并正确；人物事件映射、元数据与路由静态回退一致；事件自动激活与姓名关键词双命中时同一UID只注入一次；新增九人深入二次解释只保留为未注册候选稿
  - 爱丽丝隐身不等于消散；卡梅尔夫妇先短暂恢复再复燃；小丑显化体死亡不等于根治
  - 血衣默认遗忘线不得覆盖玩家实际回访；黑白小丑和猪头屠夫的幕后知识不得写入林恩可知层
  - 93条概念按当前事件前后各1窗口匹配，事件数组、标题数组、关键词路由、双命中去重一致；静态概念正文不变，状态变体概念经EJS按事件状态只渲染当前适用变体
  - 2026-08-14以大小总结（小总结01-13、大总结1/2，截止第276章）全量核对93条概念后订正：汪涛事件地点为表世界第三国中；血锯揭露猪头屠夫送达者归属E26（该概念事件数组E20改E23）；夜医转职阶段二内容下放变体；传说左轮E13改E11、夜魔刀E12改E13、聚焦之瞳/龙息之臂补E13、过往遗念/限时诅咒清除补E19（contract与worldbook同步）；清除"小呀哒"等阶段三昵称；幸福之家传闻去除玛丽夫人姓名
  - UID400至451全部采用阶段二详写结构，含唯一事实门槛与完整信息边界；逐条核对阶段1大总结和小总结01至07，不把后续揭示提前写成林恩已知事实
  - initial_variables、Schema、开场initvar与状态栏FALLBACK_STATE深度一致
  - 事件迁移只用完整replace /事件；验证取消态不自动推进及局部依赖正反例
  - 所有新增或修改世界书条目开启两项防递归开关
  - 不包含可运算战斗、等级、装备、库存、货币、经营或日历系统
  - npm run check通过后记录新字节数、检查数与SHA-256；真实宿主状态继续为pending
