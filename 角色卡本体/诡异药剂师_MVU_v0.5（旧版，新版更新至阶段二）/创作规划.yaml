    - S1·怪物客户建立期
    - S2·血衣与药剂风波期
    - S3·魔人协会冲突期
    - S4·猎头者家庭与师徒归来期
  mechanisms:
    - 视界系统
    - 诅咒与医疗
    - 巨像及血肉机械技术
  factions:
    - 魔人协会
    - 猎头者家族
    - 人偶庄园
    - 夜医
    - 独角恶鬼族
    - 游魂巷居民
  locations:
    - 血锯药剂店
    - 45号血衣住所
    - 凄凉荒野与倒吊塔
    - 独角鬼王神庙
