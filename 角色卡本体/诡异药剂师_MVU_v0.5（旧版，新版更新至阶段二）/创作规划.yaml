project:
  name: 诡异药剂师_MVU_v0.5
  display_name: 《诡异药剂师》v0.5
  form: charactercard
  card_type: mvu_zod
  artifact: dist/诡异药剂师_v0.5.json
  ui_mode: frontend
  source_base: 诡异药剂师_MVU_v0.4
  source_scope: 人设EJS分阶段重写（完全复制v0.4事件链EJS；8角色6组件按阶段门控，第1章至第149章阶段1）
  release_policy: v1.0前仅内部使用，不公开发布；按开源标准制作，玩家主权优先

highest_rule:
  - 角色卡最终目标是尽量还原整部小说的世界观与人物，使玩家扮演17岁林恩在小说世界中自由行动
  - 原作事件是世界自行运转时的默认因果，不是要求玩家复刻的固定剧情
  - 玩家独占林恩的对白、主动动作、决定、判断、记忆与内心
  - 本卡按开源标准制作：不预设关系结局，不自动推进亲密，不替玩家拒绝或接受
  - 格局指向紫罗兰大君级长线愿景：阶段1埋渡鸦、猪头屠夫、巨像计划与穿越真相伏笔，但不提前展开

constraints:
  core_characters:
    - 左左
    - 血锯
    - 血衣女士
    - 小小
    - 人偶夫人
    - 泰坦头颅
    - 巫神头颅
    - 小宝贝
  component_matrix:
    all: [角色速览, 基础信息, 性格调色盘, 三面性, 多阶段人设, 二次解释]
    runtime: 每名角色的六个源码组件合并成一条姓名触发蓝灯词条
    stage_split: 组件内容按事件状态条件分段，未接触阶段不呈现最终版人设
    sparse_data: 资料不足时写未知或待后续补充，不依据名称或相似作品推断
  fixed_boundaries:
    - 血锯固定为非恋爱师徒
    - 小小固定为非性伙伴与家人（幼态角色，仅为结构兼容保留恶堕字段且永久锁定0）
    - 泰坦头颅与巫神头颅固定为非恋爱
    - 小宝贝固定为非恋爱特殊生物伙伴
    - 八名主要角色不会永久死亡或彻底退出
    - 恶堕值：成年女性角色建MVU变量，初始为0，不锁定；数值只随玩家明确行动与事件实际发生变化；小小仅为结构兼容保留字段且永久锁定0
    - 不建立战斗数值、等级成长、阶位、装备、技能树、库存、货币或经营系统；林恩原文等级只作轻量记录
    - 不维护天数计数，时间线纯事件驱动
    - 宿主或预设若要求输出`<dream_scene><date>`等日期栏，只能填写“事件锚点/阶段标签 + 相对时段”；正文、日期栏、系统提示与MVU均不得出现星期、具体日历日期、“第N天”或“次日/翌日/第二天”，统一改写为事件锚点与相对时段（如“E05收尾·黎明”）
    - 复述玩家已明确的林恩行动时只陈述动作本身；不得附加玩家未声明的态度、性格、情绪、勇气、犹豫与内心判断，例如“毫不犹豫”“没有畏惧”“面无表情”“心中已经判断”
    - 玩家声明的一组动作兑现完毕后必须立即停止代写林恩；不得续写新的姿态、表情、视线、语气、等待动作或身体动作。发送前逐句检查以“林恩/你”为主语的动作与外在状态，除玩家本轮明确声明或NPC强加的非自愿身体后果外一律改写为环境/NPC结果
    - 玩家只声明“继续营业/等待病人”时，只能确认营业继续，不得扩写“安静地等待”“留在位置上等待”“安静地留在位置上”等未声明的姿态或行为方式；等待语义不授权叙事者补充副词、位置与身体状态
    - 玩家以概括句声明手术、治疗、清理等动作时，复述采用“结果化、无新增步骤”的被动句，不得自行拆解成手部动作、工具、姿势、速度、熟练度或情绪。例如“实施开腹手术，完整取出血婴并处理切口”只能写“腹腔被打开；血婴被完整取出；切口处理完毕”，不得以林恩为主体补写按住、持刀、戴手套、消毒、准确/稳稳/熟练/飞快等执行细节；玩家明确要求安装或伤口稳定时，允许客观描述物件/伤口的可观察稳定结果
    - 关键运行协议不得只依赖预设可选的`system_prompt`/`post_history`占位：玩家主权白名单、状态栏占位符与唯一JSON Patch变量块要求同时镜像到既有常驻世界书核心/MVU条目，兼容保留worldInfo但省略角色系统/后置插槽的普通预设；不因此新增世界书条目
  inheritance:
    - v0.3.3.1源码作为工程基线；v0.4完成20锚点事件链重构；v0.5在完整沿用该事件链的基础上，重写8名主要角色六组件EJS，并增加事件介绍、详情窗口与52条事件概念/物品概念双路激活
    - 全局版角色档案（角色档案（全局版））作为人设底稿，写入世界书时只写阶段1事件解锁范围内的内容
    - 爱丽丝完全移除；黑弦月不作为主要角色或独立人设存在，仅保留E20物品概念，事件实际发生前只能作为尚未到货/租借在途信息
  worldbook_maintenance:
    - 所有新增或修改条目必须设置 extensions.exclude_recursion=true
    - 所有新增或修改条目必须设置 extensions.prevent_recursion=true
    - 小设定（魂灯、门槛、价目表、信使、折跃等）不单独建条目，融入势力、地点与事件
    - 事件概念词条（能力/诅咒/物品/场景/势力/特殊设定）独立建条目于 src/concepts/：同一词条采用“当前锚点 ±3 事件窗口强制激活 OR 酒馆原生绿灯关键词激活”；关键词路完全继承宿主对 user+AI、全局扫描深度、递归缓冲与大小写的原生规则，两路同时命中按同一世界书 UID 只注入一次。跨事件共用概念只建一条、关联事件数组增量追加。此为对小设定"不单独建条目"的刻意例外
    - 概念正文保持静态；事件关联数组维护在 src/worldbook.json 的 extensions.tavernweave.event_ids，由不输出提示词的 @@preprocessing 内部路由在酒馆原生世界书扫描前调用 activewi(..., true)
    - 机制/势力/地点词条内容绑定其首次登场事件：事件未触发前只显示"未解锁"占位，触发后显示全文
    - 配角（情报员024、械魔、噬心魔、玥玥等）并入对应词条并用关键词触发，不单独建卡

