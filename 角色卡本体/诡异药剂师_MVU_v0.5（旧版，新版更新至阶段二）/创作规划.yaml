validation:
  - chara_card_v3与顶层/data镜像一致
  - 八名主要角色六组件源码齐全且运行时合并正确
  - 六类势力、三套机制、五处地点、二十个事件锚点齐全
  - 所有新增或修改条目同时开启两项防递归开关
  - MVU无病例根且Schema、初始变量、更新规则、输出格式、状态栏语义一致
  - 全部关系角色保留恶堕兼容字段且初始为0；小小永久锁定0，非恋爱角色吸引为0
  - 无爱丽丝残留；黑弦月仅作为E20物品概念或受事件门控的尚未到货/租借语境出现
  - 配角并入势力/地点/事件，无独立配角词条
  - 开场白按文风12项自检清单人工核验
  - 开场状态：E01完成、E02活跃且收尾为true、E03未触发、唯一活跃事件为E02、近期预兆为空
  - 19对常驻即时衔接段存在且按状态EJS门控渲染；各对触发时机以自带「触发时机」为准，未满足不得启动
  - 每个事件含完成/取消条件，收束判定以事件自身条件为准，中途事实不得计为完成
  - 事件上下文窗口按状态定位当前锚点并渲染前后各3事件摘要（不依赖关键词、不开递归）
  - 事件详情窗口由构建生成：当前±1事件详情并入常驻条目并按状态展开，未触发仍只显示占位
  - 系统提示与更新规则含衔接优先、第一轮推进语与触发时机守卫规则
  - 状态栏以酒馆助手可识别的前端HTML代码块渲染，提供四页签与手动推进按钮
  - 状态栏仅允许最新楼层写入；历史楼层只读，推进前必须重新读取latest并只写回latest，连续点击最多提交一次
  - MVU尚未持久化、宿主API不可用或写入进行中时推进按钮必须禁用并显示明确状态；不得以初始回退数据执行写入
  - 状态栏卸载后停止轮询、事件订阅与交互监听；窄屏、键盘页签与重渲染后仍可用
  - 锚点收尾标记合法（E01与E02初始true、其余false），衔接门控与按钮就绪要求前件收尾或收束
  - `变形`只作为替代结果稳定形成后的收束态，唯一活跃事件只对应`活跃`锚点
  - 事件身份/状态/收尾/预兆ID迁移必须以单条`replace /事件`原子提交完整事件对象；验证器覆盖合法迁移与拆分补丁负例
  - 无活跃事件与无近期预兆都必须为标准空对象；Schema、更新规则和状态栏不得接受或显示残留详情
  - 玩家主权规则在system、post-history、示例和事件引子中一致，不得出现要求叙事者紧贴林恩判断/情绪或替林恩完成默认行动的冲突指令
  - 除不可改写的原文开场白摘抄外，真机生成回复正文、隐藏分析、MVU字段和宿主格式日期栏不得出现星期、具体日期、任何“X天”时长或“昨天/昨日/昨夜/今天/今日/今早/今晨/明天/明日/次日/翌日/第二天”；验证器必须覆盖`<dream_scene><date>`格式，真机驱动逐轮扫描完整实际回复；今夜、黎明、傍晚、午夜与能力的24小时时限仍是允许的事件相对时段；叙事或问诊必须表达持续时间时，统一使用“持续已久”“刚开始不久”“一阵子”等不带日历单位的描述
  - 真机回复不得给玩家已声明动作附加未声明的林恩态度、情绪或内心定性；测试驱动记录固定高风险短语并由人工逐轮复核
  - 开场基线首轮推进语必须以单条`replace /事件`完成E02→E03预兆事务；正文与变量必须同轮一致，禁止出现“正文已写猪头魔预兆而E02仍活跃”的半迁移
  - 每轮发送前按玩家主语动作白名单复核：玩家声明动作结束后不得新增林恩/“你”的表情、姿态、视线、语气或行动，也不得给已声明动作增加“精准/仔细”等执行评价；验证器覆盖“面无表情”、精准补刀、仔细检查和无声明续写动作负例
  - 关键协议双投递：角色卡`system_prompt`/`post_history`与常驻世界书核心/MVU条目均含玩家主权、`<StatusPlaceHolderImpl/>`和唯一`<UpdateVariable><JSONPatch>`末尾协议；在省略角色系统/后置占位的兼容预设中仍能运行
  - 角色卡`system_prompt`与`post_history`为独立完整提示，不使用未注册的`{{original}}`宏；Default等兼容预设渲染时控制台不得出现Macro original异常
  - `事件.最近结果`的每一项必须是含`事件ID/标题/结果/世界影响`四个字符串字段的对象，验证器覆盖字符串数组负例，真机驱动逐轮确认事件迁移确实落盘
  - 酒馆原生世界书持久化可能剥离`extensions.tavernweave.event_ids`；概念事件路由优先读取该字段，真机缺失时必须从静态正文首行标题的`事件[...]`数组回退解析，禁止因元数据丢失而静默退化成纯关键词路
  - `<Analysis>`中的时间自检只能写“时间格式合规”，不得复述任何被禁时间词、具体日期或负例；真机驱动继续扫描包括隐藏分析在内的完整原始回复
  - 闭合`<think>`块同时从前端显示与后续模型上下文隐藏，普通正文不得被吞掉
  - 事件蓝灯带EJS状态门槛，未触发时不公开详情
  - 世界书共102条：49条既有条目、1条不输出提示词的概念事件预处理路由、52条原生绿灯概念
  - 52条概念必须为constant=false、主关键词非空、无二级关键词；关键词路继承酒馆原生user+AI扫描语义，事件路按当前锚点±3调用activewi强制激活同一UID
  - 概念正文不得残留@@private或事件EJS外壳；标题事件数组必须与extensions.tavernweave.event_ids一致，双路同时命中只注入一次
  - 真机生成期不得出现Identifier重复声明、预处理路由异常或重复概念正文
  - 不包含战斗、等级、装备、库存、货币或经营系统，不维护天数计数
  - 离线构建和验证通过后仅标记候选版
  - 验证器成功摘要必须把离线检查结果与真实宿主发布状态分字段报告：使用`offline_validation: passed`与`real_host_acceptance: accepted-release`，不得再以`candidate`字段承载离线结果
  - 真实酒馆导入、新聊天、MVU、四页状态栏、历史楼层只读、单次推进持久化、窄屏与监听日志由AGENT B留证后，再交所有者确认
  - 概念双路真机矩阵必须覆盖：仅事件、仅user关键词、仅AI关键词、两路均不命中、两路同时命中且只注入一次；临时测试卡与绑定世界书验收后成对清理
  - E01-E06真机驱动必须为每个推进指令声明预期锚点状态；任一轮回复后状态未达到预期即立即失败，禁止用相同输入盲目重试掩盖MVU更新拒绝
  - E01-E06真机驱动逐轮按生成前事件状态计算±3窗口，并断言窗口内每条概念静态正文在真实请求中恰好出现一次；不能只依赖酒馆命中摘要或构建期元数据
