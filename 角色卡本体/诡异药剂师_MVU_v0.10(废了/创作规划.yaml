highest_rules:
  - 林恩在v0.10统一为18岁，角色卡元数据、变量、Schema、开场、状态栏、事件与摘要全部同步
  - 玩家绝对独占林恩的对白、主动动作、决定、判断、记忆、态度、感情与内心
  - 原作事件只是世界默认因果；玩家可缺席、介入、取消或改变结果，稳定替代结果以变形收束
  - 角色卡运行正文禁用原文编号与总结元数据；溯源只写入编辑台账，不进入打包世界书
  - 亲密只允许明确成年、具备同意能力且持续自愿的参与者；未成年、年龄不明或幼态外形固定非性非恋爱
  - 治疗、救命、契约、所有权、任务数值、失忆、醉酒、睡眠、恐惧、依赖与权力差不能制造同意
  - 原著中的欺骗、强迫与越界只记录伤害、信任裂痕和后果，不色情化、不奖励化
  - 以M是快感冲击机制，性行为解咒与恶堕调教是原著机制事实；运行时仍须服从成年人、知情、自愿与玩家主权

