project:
  name: 诡异药剂师_MVU_v0.4
  display_name: 《诡异药剂师》v0.4
  form: charactercard
  card_type: mvu_zod
  artifact: dist/诡异药剂师_v0.4.json
  ui_mode: frontend
  source_base: 诡异药剂师_MVU_v0.3.3.1
  source_scope: 事件链重构（20锚点，第1章至第149章阶段1）
  release_policy: v1.0前仅内部使用，不公开发布；按开源标准制作，玩家主权优先

highest_rule:
  - 角色卡最终目标是尽量还原整部小说的世界观与人物，使玩家扮演20岁林恩在小说世界中自由行动
  - 原作事件是世界自行运转时的默认因果，不是要求玩家复刻的固定剧情
  - 玩家独占林恩的对白、主动动作、决定、判断、记忆与内心
  - 本卡按开源标准制作：不预设关系结局，不自动推进亲密，不替玩家拒绝或接受
  - 格局指向紫罗兰大君级长线愿景：阶段1埋渡鸦、猪头屠夫、巨像计划与穿越真相伏笔，但不提前展开

constraints:
  core_characters:
    - 左左
    - 血锯
    - 血衣女士
    - 小小
    - 人偶夫人
    - 泰坦头颅
    - 巫神头颅
    - 小宝贝
  component_matrix:
    all: [角色速览, 基础信息, 性格调色盘, 三面性, 多阶段人设, 二次解释]
    runtime: 每名角色的六个源码组件合并成一条姓名触发蓝灯词条
    stage_split: 组件内容按事件状态条件分段，未接触阶段不呈现最终版人设
    sparse_data: 资料不足时写未知或待后续补充，不依据名称或相似作品推断
  fixed_boundaries:
    - 血锯固定为非恋爱师徒
    - 小小固定为非性伙伴与家人（幼态角色，不建恶堕值）
    - 泰坦头颅与巫神头颅固定为非恋爱
    - 小宝贝固定为非恋爱特殊生物伙伴
    - 八名主要角色不会永久死亡或彻底退出
    - 恶堕值：全部女性角色建MVU变量，初始为0，不锁定；数值只随玩家明确行动与事件实际发生变化
    - 不建立战斗、等级、阶位、装备、技能树、库存、货币或经营系统
    - 不维护天数计数，时间线纯事件驱动
  inheritance:
    - v0.3.3.1源码作为工程基线；v0.4为事件链重构版：开场白正文不变，事件锚点扩展为20个（按阶段1小总结1-7合并），19对事件剧情引子常驻EJS按状态渲染
    - 全局版角色档案（角色档案（全局版））作为人设底稿，写入世界书时只写阶段1事件解锁范围内的内容
    - 爱丽丝、黑弦月在本版本完全移除，不保留预告词条
  worldbook_maintenance:
    - 所有新增或修改条目必须设置 extensions.exclude_recursion=true
    - 所有新增或修改条目必须设置 extensions.prevent_recursion=true
    - 小设定（魂灯、门槛、价目表、信使、折跃等）不单独建条目，融入势力、地点与事件
    - 配角（情报员024、械魔、噬心魔、玥玥等）并入对应词条并用关键词触发，不单独建卡

world:
  phases:
    - S0·药店接管期
    - S1·怪物客户建立期
    - S2·血衣与药剂风波期
    - S3·魔人协会冲突期
    - S4·猎头者家庭与师徒归来期
  mechanisms:
    - 视界系统
    - 诅咒与医疗
    - 巨像及血肉机械技术
  factions:
    - 魔人协会
    - 猎头者家族
    - 人偶庄园
    - 夜医
    - 独角恶鬼族
    - 游魂巷居民
  locations:
    - 血锯药剂店
    - 45号血衣住所
    - 凄凉荒野与倒吊塔
    - 独角鬼王神庙
    - 人偶庄园
  overview: 死界总览（诸神遗弃之地、魂灯与门槛、游魂巷大局、不眠夜规则）
  long_arc_teasers:
    - 猪头屠夫与"某位存在"的交易
    - 巨像计划与"某些可怕发现"
    - 渡鸦与紫罗兰法阵的隐线
    - 神圣之矛来源与猎头者坠落真相

stage1_fact_digest:
  source: 角色卡设定/人设/deepseek小说总结（小总结）.md 的阶段1大总结
  user_overrides:
    - 不建立原作中的等级、属性、技能树、装备、库存、货币、经营或战斗系统
    - 系统采用任务+图鉴轻量版：任务发布、成就、图鉴、吐槽；等级/属性/技能仅作轻量成长记录
    - 小小固定为非恋爱家人，原作中的婚约或爱慕表述不进入本卡
    - 恶堕值按作者定义：女性角色亲密接受度；初始0、不锁定，仅玩家行动与事件推进
  confirmed_facts:
    - 血娃娃上门、猪头魔腹中恶灵血婴、猎魔人奥卡洛斯与黑骑士
    - 小小夜间牙科：后槽牙卡破损神圣之矛碎片，林恩命名并安装钢牙
    - 血衣女士寻子、鸿门宴、限时诅咒清除24h续费绑定、好感度突破300
    - 暴击药剂秃头副作用扩散（黑骑士与猎魔人双秃死斗）
    - 血肉傀儡"地狱行者"追杀，左左诞生与共存，小宝贝巨型舌头首次支援
    - 猎杀者夜袭、情报员024立场偏移与面部抹除
    - 械魔进攻被小小碾压、噬心魔亲征被猎头者围殴、协会覆灭
    - 过往遗念再现完整形态、泰坦诅咒削弱15%、巫神逼婚与心灵契约、视界群组
    - 血锯与人偶夫人归来、阵营判定混乱善良、夜医职业风险、黑弦月租借在途
  unresolved:
    - 心灵契约是否真的可抹消
    - 泰坦头颅周日放假规律的刻意性
    - 血锯退出魔人协会完整原因与"男人最怕的问题"
    - 巨像计划"某些可怕发现"内容
    - 左左蜕皮后能力变化
    - 神圣之矛来源与猎头者家族坠落真相

events:
  activation: 常驻精简索引负责阶段、地点和条件；独立蓝灯详情由稳定事件ID触发
  status_values: [未触发, 预兆, 活跃, 变形, 完成, 取消]
  concurrency: 同时只允许一条重大事件活跃
  time_progression: 纯事件驱动；不记录天数，E01完成后E02才可能进入预兆
  rules:
    - 事件按世界阶段、有效行动和因果条件启动，不要求林恩到场
    - 预兆方向可靠但细节模糊，详细蓝灯在事件ID写入后的下一轮加载
    - 林恩缺席时有限演算，主要角色的不可逆结果停在可介入危机节点
    - 偏离原作后按新因果生成替代事件，不强行拉回原作
    - 普通原创来客不占重大事件位，产生长期影响后才进入待定队列
    - 衔接优先：常驻即时衔接段处于渲染条件时，本轮必须输出对应剧情引子与预兆写法；各对触发时机以自带「触发时机」为准，未满足不得启动；锚点链就绪时禁止原创来客占位
    - 收尾标记：每个锚点带布尔`收尾`；事件主体完成、只差玩家推进时置true，进行中置false；只有收尾为true或状态为完成/变形/取消的前件才允许衔接下一事件
    - E20收束后不自动设计第149章后的续接、循环或结局
  anchors:
    - E01·系统觉醒与开店
    - E02·血娃娃上门与找妈妈任务
    - E03·猪头魔与恶灵血婴
    - E04·猎魔人治疗与传说左轮
    - E05·不眠夜与小小牙科
    - E06·诅咒清除能力与鬼婴塑形
    - E07·血衣寻子与鬼婴萌化化解
    - E08·暴击药剂与视界曝光
    - E09·血衣鸿门宴与诅咒绑定
    - E10·视界经营与玥玥治疗
    - E11·血夜地狱行者与左左诞生
    - E12·血肉灾变与左手共存
    - E13·猎杀者夜袭与信使线
    - E14·瘦长鬼影手术与024诊断
    - E15·求援信与小小赴约
    - E16·械魔大军与猎神者
    - E17·小小介绍棒医生
    - E18·倒吊塔决战与协会覆灭
    - E19·猎头者家族绑定
    - E20·师徒归来与阶段收束

mvu:
  roots: [元数据, 世界, 林恩, 事件, 关系, 角色关系, 系统]
  removed_roots: [病例]
  update_protocol: UpdateVariable.JSONPatch
  migration: 不迁移v0.2或v0.3旧聊天，只保证v0.3.3.1新聊天
  relationship_rule:
    - 八名主要角色完整追踪关系、人物阶段、位置与当前处境
    - 林恩缺席时，对林恩的关系数值不自行变化
    - 好感/信赖/恶堕统一0-100，互不合并；原文大数值（如血衣300+）按语义映射
    - 重要角色彼此关系使用动态边列表，不建立八人全矩阵
  evil_value_rule:
    - 全部女性角色（血衣女士、人偶夫人、巫神头颅、左左）建恶堕值变量，初始0，不锁定
    - 幼态角色小小不建恶堕值，维持非性边界
    - 阶段1内可由事件自然推进的仅血衣女士与人偶夫人；其余保持0直到玩家行动或后续版本启用
  event_rule:
    - 固定记录20个锚点的六态状态
    - 记录唯一活跃事件、近期预兆、最近结果、阶段总结与原创重大事件待定队列
  system_rule:
    - 系统根维护当前任务链、任务状态、图鉴已收录项、成就列表与系统提示
    - 林恩根维护轻量成长记录（等级、技能、成就、图鉴解锁项）

system:
  mode: 任务+图鉴轻量版
  features: [任务发布, 成就弹窗, 图鉴收录, 系统吐槽]
  growth_record: 等级/属性/技能仅作轻量成长记录，不展开为数值系统
  forbidden: [商城, 库存, 货币, 装备栏, 技能树, 经营结算]
  main_quest_chain:
    - 活过血夜（E01-E02基础）
    - 建立怪物客户群（E03-E05）
    - 覆灭魔人协会（E07-E10）
    - 猎头者家族绑定（E11）
    - 转职夜医（E20阵营判定）
    - 师徒归来与阶段收束（E20）

ui:
  style: 死界通用暗色界面，魂灯、黑雾与系统蓝光
  pages: [当前状态, 人物关系, 世界事件, 系统]
  interaction:
    - 只显示已解锁人物
    - 姓名被主动提到可解锁人物页，但只显示姓名与状态
    - 人物和事件卡片使用内联展开
    - 关系同时显示数值条与文字判断
    - 系统页展示当前任务、图鉴与恶堕值
    - 轻微动效并尊重 prefers-reduced-motion
  data_source: 保留Mvu接口与宿主聊天消息变量双路径读取，不建立第二套状态源

first_message:
  policy: 小说第1-4章血娃娃剧情原文逐字摘抄（仅格式调整），源文件为src/prompts/opening_source.txt
  verbatim_rule: 开场白正文不得修改原文；剧情修改须同步原文源；验证器做归一化逐字比对
  ending: 血娃娃诊疗完成、右眼抵押、隐藏任务"血娃娃找妈妈"触发（完成度2%），玩家从处置盘中线索开始
  active_event: E01完成、E02·血娃娃上门与找妈妈任务（收尾活跃态）、E03未触发

delivery:
  artifact: dist/诡异药剂师_v0.4.json
  additional_worldbook: false
  png: false
  coexist_with_v0_3: true
  acceptance_status: candidate
  acceptance_record: host_acceptance.json
  runtime:
    sillytavern: 1.17.0
    tavern_helper: 4.8.19
    new_plugin: false
    pinned_remote_commits: true

validation:
  - chara_card_v3与顶层/data镜像一致
  - 八名主要角色六组件源码齐全且运行时合并正确
  - 六类势力、三套机制、五处地点、二十个事件锚点齐全
  - 所有新增或修改条目同时开启两项防递归开关
  - MVU无病例根且Schema、初始变量、更新规则、输出格式、状态栏语义一致
  - 恶堕值变量全女性角色存在且初始为0，非恋爱角色吸引为0
  - 无爱丽丝、黑弦月残留引用
  - 配角并入势力/地点/事件，无独立配角词条
  - 开场白按文风12项自检清单人工核验
  - 开场状态：E01活跃收尾、E02未触发、近期预兆为空
  - 19对常驻即时衔接段存在且按状态EJS门控渲染；各对触发时机以自带「触发时机」为准，未满足不得启动
  - 每个事件含完成/取消条件，收束判定以事件自身条件为准，中途事实不得计为完成
  - 事件上下文窗口按状态定位当前锚点并渲染前后各3事件摘要（不依赖关键词、不开递归）
  - 事件详情窗口由构建生成：当前±1事件详情并入常驻条目并按状态展开，未触发仍只显示占位
  - 系统提示与更新规则含衔接优先、第一轮推进语与触发时机守卫规则
  - 状态栏提供手动推进按钮（就绪判定与常驻衔接段一致，点击把下一事件写入预兆）
  - 锚点收尾标记合法（E01初始true、其余false），衔接门控与按钮就绪要求前件收尾或收束
  - 事件蓝灯带EJS状态门槛，未触发时不公开详情
  - 不包含战斗、等级、装备、库存、货币或经营系统，不维护天数计数
  - 离线构建和验证通过后仅标记候选版
  - 真实酒馆导入、新聊天、MVU、四页状态栏和事件流程由所有者确认
