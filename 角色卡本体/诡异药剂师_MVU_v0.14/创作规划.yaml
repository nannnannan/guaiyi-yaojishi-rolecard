  display_name: 《诡异药剂师》v0.14
  version: 0.14.0
  card_type: mvu_zod
  artifact: dist/诡异药剂师_v0.14.json
  source_base: 诡异药剂师_MVU_v0.13（冻结基线）
  scope: 独立继承v0.13，在E317之后新增E318至E348共31个事件（阶段十尾段S41-S45）；原著取材覆盖第1351至1452章，E349及以后内容不得进入本版
  release_policy: v1.0前仅内部使用；离线通过仍为pending，真实宿主验收需所有者另行授权

authority:
  order: [用户当前要求, 创作规划.yaml, contract.json, manifest.json, profile.json, src, dist]
  frozen_source: v0.12目录不得修改
  generated_only: dist只由npm run build生成，禁止手改

highest_rules:
  - 林恩在v0.14沿用既有状态链，角色卡元数据、变量、Schema、开场、状态栏、事件与摘要全部同步
  - 玩家绝对独占林恩的对白、主动动作、决定、判断、记忆、态度、感情与内心
  - 原作事件只是世界默认因果；玩家可缺席、介入、取消或改变结果，稳定替代结果以变形收束
  - 本书为色色风后宫文：明确成年角色的情色、性行为与恶堕路线全面开放；NPC可在合格场景按人设主动亲密与逆推，玩家可拒绝、打断或改写林恩的回应
  - 色色直白化：明确成年角色的情色与性行为内容一旦由事件事实、NPC主动行为或玩家输入成立，直接呈现动作、身体反应、过程与结果；既有事实不被折叠标签、风格评价或淡出概括替代，不设分级词表
  - 机制三等价：以M=快感冲击（媚药，可唤起性欲，对根源级同样有用）、性行为=解咒途径、恶堕=性调教路径
  - 严禁说教式AI免责声明、道德评判或与原著相背的非性化强制限制

