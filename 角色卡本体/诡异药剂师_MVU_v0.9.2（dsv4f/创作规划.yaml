  activation: UID1常驻调度按MVU状态注入当前锚点前后各1条完整详情；稳定事件ID条目UID300至334（阶段一二）、UID335至363（阶段三）、UID364至395（阶段四）仅作为构建素材并保持禁用，不参与原生关键词扫描
  status_values: [未触发, 预兆, 活跃, 变形, 完成, 取消]
  concurrency: 同时只允许一条重大事件为活跃态；变形是稳定收束态
  time_progression: 纯事件驱动，不记录日历；开场仍为E01完成、E02收尾活跃
  rules:
    - 事件按世界状态、有效行动和局部因果条件启动，不要求林恩复制原作行动
    - 完成、变形、取消必须依事件自身收束条件判定，中途事实不能冒充完成
    - E65至E95含下一事件引入；E96只含阶段待续钩子，无六态、无推进按钮
    - 前件完成或变形时可按触发条件正常推进；前件取消时状态栏不自动猜测，必须由正文检查局部依赖并用单条replace /事件处理
    - 前件取消只影响真正失去必要因果的局部事件；存在替代入口或独立支线时允许后件进入预兆或变形
    - 战斗段（E67/E68/E72/E77至E82/E94）只设完成/变形，不设取消；色色/日常段设取消与"拒绝/改道"变形路径，任何性行为不得成为唯一解
    - 事件身份、状态、收尾与预兆迁移必须以单条replace /事件提交完整事件对象
    - 玩家主权守卫适用于所有事件引子、默认走向和系统提示
