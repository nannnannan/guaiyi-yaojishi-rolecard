validation:
  - v0.7目录、产物和accepted-release记录保持不变并冻结
  - validate.mjs常量全部从contract.json派生（版本、96锚点、95桥、27人、世界书条数、素材区间、概念区间、字数分支）
  - 世界书条目数随worldbook.json实际派生，不硬编码260
  - 96事件：E01至E95有六态门控（E96除外）、双标题、固定字段顺序和明确收束条件；E65至E95有下一事件引入，E96无推进按钮
  - 全卡桥95对（E01→E02至E95→E96）；E64→E65桥前件判断挂E63
  - 事件默认走向300至500字；大锚点E77/E80/E94多幕分段，整条不超800字；事件源码上限3000至5000字
  - 二十七名角色六组件源码齐全且运行时合并正确；新增3人按"未登场锁+事件门控"建立，素材不足处写"不详"严禁瞎编；9份候选二次解释已注册
  - 色色与恶堕全面开放：恋爱开放角色关系字段无锁；固定非恋爱角色维持锁；涩涩度/情感开发度/驯服度/崩坏值/恨意值按归属实现
  - 概念详写、数量不设上限、无字数上限但保留十字段结构与变体门控断言；事件数组/标题/关键词路由一致；"大鸡巴"等原文暗语直写
  - 卡内正文断言：不得出现"第X章/小总结/大总结/阶段几"等元数据词汇
  - initial_variables、Schema、开场initvar与状态栏FALLBACK_STATE深度一致（96锚点、27人）
  - 事件迁移只用完整replace /事件；验证取消态不自动推进及局部依赖正反例
  - 所有新增或修改世界书条目开启两项防递归开关
  - 阶段五泄漏负例：第560章起内容不得写成已发生；E96只列封存线程
  - 不包含可运算战斗、等级、装备、库存、货币、经营或日历系统
  - npm run check通过后记录新字节数、检查数与SHA-256；真实宿主状态继续为pending
