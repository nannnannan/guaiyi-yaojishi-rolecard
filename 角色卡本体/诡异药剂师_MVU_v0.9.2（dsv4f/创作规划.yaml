mvu:
  roots: [元数据, 世界, 林恩, 事件, 关系, 角色关系, 系统]
  removed_roots: [病例]
  update_protocol: UpdateVariable.JSONPatch
  migration: 不迁移旧聊天，只保证v0.8新聊天
  relationship_rule:
    - 二十七名核心人物复用同一关系结构；在17字段基础上扩展：涩涩度（0至100，恋爱开放角色通用，固定非恋爱锁0）、情感开发度（仅黑弦月）、驯服度/崩坏值/恨意值（仅银色幻想）
    - 未使用的新字段恒0且状态栏不渲染；信任度并入信赖；亲情不建字段
    - 林恩缺席时，对林恩的关系数值不自行变化
    - 好感、信赖、戒备、吸引、关系创伤与恶堕互不合并，范围0至100；色色与恶堕全面开放，恋爱开放角色无锁
    - 重要角色彼此关系使用动态边列表，取消64上限，按需建立、不建全矩阵
  event_rule:
    - 固定记录96个锚点六态（E96除外），阶段总结最多8条
    - 无活跃事件与无近期预兆使用标准空对象
    - 最近结果最多12条，每项含事件ID、标题、结果、世界影响四个字符串字段
  lin_en_fields:
    - 新增：压力、道德、罪恶、复苏度、替死娃娃剩余、天使之吻状态、根系网络权限、巨像网络权限
    - 不进MVU：六诅咒残留（纯叙事）、以M充能率、RPG属性、货币经验、传奇道具库存
  initial_state:
    - E01完成、E02活跃且收尾为true、E03至E96未触发
    - 新增三人关系对象均未解锁，恶堕初始0；新增关系字段初始0
    - initial_variables、开场initvar与状态栏FALLBACK_STATE必须深度一致

